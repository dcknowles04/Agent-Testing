<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root {
  /* Layout: sticky top bar, centered 1280px work area, cards for each working surface. */
  --bg: #f4f6f9;
  --card: #ffffff;
  --subtle: #f8f9fb;
  --hover: #f3f6fb;
  --ink: #1c2433;
  --muted: #627089;
  --line: #e1e5ec;
  --line-strong: #c3c9d4;
  --accent: #1f5fbf;
  --accent-soft: #e7effb;
  --on-accent: #ffffff;
  --green: #1b7f49;
  --green-soft: #e1f3e8;
  --green-line: #9fc5a8;
  --yellow: #9a6200;
  --yellow-soft: #fff3d3;
  --amber: #d99a00;
  --red: #bf3328;
  --red-soft: #fce6e3;
  --gray-soft: #edf0f4;
  --purple: #6643bd;
  --purple-soft: #eee8fa;
  --note-ink: #6b4800;
  --info-ink: #173f7a;
  --paper: #fffef8;
  --code-bg: #f5f7fa;
  --banner-bg: #252a35;
  --banner-fg: #ffd166;
  --toast-bg: #252a35;
  --toast-fg: #ffffff;
  --shadow: rgba(16, 24, 40, 0.18);
  --font-ui: "Public Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-letter: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12161d; --card: #1a2029; --subtle: #1f2631; --hover: #222b38; --ink: #e5e9f0; --muted: #98a3b6;
    --line: #2d3644; --line-strong: #46516a; --accent: #6ea2f2; --accent-soft: #1d2d47; --on-accent: #0d1420;
    --green: #5cc98b; --green-soft: #173225; --green-line: #2f6a49; --yellow: #f0bf55; --yellow-soft: #3a2f14;
    --amber: #e8b33a; --red: #f07a6f; --red-soft: #3d1f1d; --gray-soft: #262e3a; --purple: #b39af0; --purple-soft: #2c2445;
    --note-ink: #f3d79a; --info-ink: #b9d2f7; --paper: #1d222b; --code-bg: #161b23; --banner-bg: #0b0e13;
    --banner-fg: #ffd166; --toast-bg: #e5e9f0; --toast-fg: #12161d; --shadow: rgba(0, 0, 0, 0.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12161d; --card: #1a2029; --subtle: #1f2631; --hover: #222b38; --ink: #e5e9f0; --muted: #98a3b6;
  --line: #2d3644; --line-strong: #46516a; --accent: #6ea2f2; --accent-soft: #1d2d47; --on-accent: #0d1420;
  --green: #5cc98b; --green-soft: #173225; --green-line: #2f6a49; --yellow: #f0bf55; --yellow-soft: #3a2f14;
  --amber: #e8b33a; --red: #f07a6f; --red-soft: #3d1f1d; --gray-soft: #262e3a; --purple: #b39af0; --purple-soft: #2c2445;
  --note-ink: #f3d79a; --info-ink: #b9d2f7; --paper: #1d222b; --code-bg: #161b23; --banner-bg: #0b0e13;
  --banner-fg: #ffd166; --toast-bg: #e5e9f0; --toast-fg: #12161d; --shadow: rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font: 14px/1.45 var(--font-ui);
  background: var(--bg);
  color: var(--ink);
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1 { font-size: 22px; margin: 0 0 4px; }
h2 { font-size: 17px; margin: 0 0 12px; }
h3 { font-size: 14px; margin: 16px 0 8px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.hidden { display: none !important; }

.banner {
  background: var(--banner-bg); color: var(--banner-fg); text-align: center; font-weight: 600;
  padding: 6px 12px; font-size: 12px; letter-spacing: .04em;
}
.topbar {
  display: flex; align-items: center; gap: 24px; padding: 10px 24px;
  background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; flex-wrap: wrap;
}
.brand { font-weight: 700; font-size: 16px; white-space: nowrap; }
.brand .muted { font-weight: 400; font-size: 13px; }
nav { display: flex; gap: 4px; flex: 1; flex-wrap: wrap; }
nav a { padding: 6px 12px; border-radius: 6px; color: var(--ink); }
nav a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
nav a:hover { text-decoration: none; background: var(--gray-soft); }
.top-actions { display: flex; gap: 8px; align-items: center; }

main { max-width: 1280px; margin: 0 auto; padding-block: 24px; padding-inline: clamp(16px, 3vw, 24px); }
h1, h2 { text-wrap: balance; }
.grid > *, .kpis > * { min-width: 0; }
.card, details.panel .body { overflow-x: auto; }
td.num, .kpi .value, .hbar .val { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.btn {
  border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); border-radius: 6px;
  padding: 8px 14px; font: inherit; font-weight: 600; cursor: pointer;
}
.btn:hover { filter: brightness(1.08); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-ghost { background: var(--card); color: var(--accent); }
.btn-green { background: var(--green); border-color: var(--green); }
.btn-red { background: var(--red); border-color: var(--red); }
.btn-sm { padding: 4px 10px; font-size: 12px; }
.btn-lg { padding: 12px 20px; font-size: 15px; }

.mode-badge {
  border: none; border-radius: 999px; padding: 5px 12px; font-weight: 700; font-size: 12px; cursor: pointer;
}
.mode-badge.live { background: var(--green-soft); color: var(--green); }
.mode-badge.demo { background: var(--yellow-soft); color: var(--yellow); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px; }
.grid { display: grid; gap: 16px; }
.grid-2 { grid-template-columns: 1fr 1fr; }
.grid-3 { grid-template-columns: repeat(3, 1fr); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin: 16px 0; }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.kpi .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
.kpi .value { font-size: 26px; font-weight: 700; margin-top: 4px; }
.kpi .sub { color: var(--muted); font-size: 12px; }
.kpi.alert .value { color: var(--red); }
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 8px; flex-wrap: wrap; }

.bar { height: 10px; background: var(--gray-soft); border-radius: 999px; overflow: hidden; margin-top: 8px; }
.bar > span { display: block; height: 100%; background: var(--accent); border-radius: 999px; }

table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; font-weight: 600; }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--hover); }
td.num, th.num { text-align: right; white-space: nowrap; }

.badge {
  display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700;
  white-space: nowrap; background: var(--gray-soft); color: var(--muted);
}
.b-green { background: var(--green-soft); color: var(--green); }
.b-yellow { background: var(--yellow-soft); color: var(--yellow); }
.b-red { background: var(--red-soft); color: var(--red); }
.b-blue { background: var(--accent-soft); color: var(--accent); }
.b-purple { background: var(--purple-soft); color: var(--purple); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; background: var(--line-strong); }
.dot.red { background: var(--red); } .dot.yellow { background: var(--amber); } .dot.green { background: var(--green); }

.filters { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0; align-items: center; }
select, input[type=text], input[type=number], textarea {
  font: inherit; border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; background: var(--card); color: var(--ink); max-width: 100%;
}
textarea { width: 100%; font-family: var(--font-mono); font-size: 12.5px; }
label.field { display: block; font-weight: 600; margin-bottom: 4px; }

/* Pipeline */
.pipeline { display: flex; align-items: stretch; gap: 0; overflow-x: auto; padding: 8px 0 4px; }
.stage { flex: 1; min-width: 96px; display: flex; flex-direction: column; align-items: center; position: relative; }
.stage:not(:last-child)::after {
  content: ""; position: absolute; top: 21px; left: calc(50% + 22px); right: calc(-50% + 22px);
  height: 3px; background: var(--line);
}
.stage.done:not(:last-child)::after, .stage.skipped:not(:last-child)::after { background: var(--green-line); }
.node {
  width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 700;
  background: var(--gray-soft); color: var(--muted); border: 3px solid var(--line); z-index: 1; font-size: 16px;
}
.stage.agent .node { border-radius: 12px; }
.stage.done .node { background: var(--green-soft); color: var(--green); border-color: var(--green); }
.stage.running .node { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); animation: pulse 1s infinite; }
.stage.skipped .node { background: var(--card); border-style: dashed; color: var(--muted); }
.stage.error .node { background: var(--red-soft); color: var(--red); border-color: var(--red); }
.stage .name { font-size: 12px; font-weight: 600; margin-top: 6px; text-align: center; }
.stage .meta { font-size: 10.5px; margin-top: 2px; text-align: center; min-height: 16px; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 var(--accent-soft); } 50% { box-shadow: 0 0 0 8px transparent; } }
@media (prefers-reduced-motion: reduce) { .stage.running .node { animation: none; } }

details.panel { background: var(--card); border: 1px solid var(--line); border-radius: 10px; margin-top: 10px; }
details.panel > summary {
  cursor: pointer; padding: 12px 16px; font-weight: 600; display: flex; gap: 10px; align-items: center; list-style: none;
}
details.panel > summary::-webkit-details-marker { display: none; }
details.panel > summary::before { content: "▸"; color: var(--muted); }
details.panel[open] > summary::before { content: "▾"; }
details.panel .body { padding: 0 16px 16px; }
.kv { display: grid; grid-template-columns: 200px 1fr; gap: 4px 16px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
pre.letter {
  white-space: pre-wrap; font-family: var(--font-letter); font-size: 13.5px; background: var(--paper); color: var(--ink);
  border: 1px solid var(--line); border-radius: 8px; padding: 16px; max-height: 420px; overflow: auto;
}
pre.json { white-space: pre-wrap; font-size: 11.5px; background: var(--code-bg); color: var(--ink); font-family: var(--font-mono); border-radius: 6px; padding: 10px; max-height: 300px; overflow: auto; }
blockquote.cite { margin: 4px 0 0; padding: 4px 10px; border-left: 3px solid var(--line); color: var(--muted); font-style: italic; font-size: 12.5px; }
ul.tight { margin: 4px 0; padding-left: 18px; }
.note { background: var(--yellow-soft); color: var(--note-ink); border-radius: 6px; padding: 8px 12px; font-size: 12.5px; margin: 8px 0; }
.note.info { background: var(--accent-soft); color: var(--info-ink); }
.flag { border-left: 4px solid var(--line); padding: 6px 10px; margin: 6px 0; background: var(--subtle); border-radius: 0 6px 6px 0; }
.flag.high { border-color: var(--red); } .flag.medium { border-color: var(--amber); } .flag.low { border-color: var(--line-strong); }
.checklist label { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; border-bottom: 1px solid var(--line); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.doc-box { margin-bottom: 14px; }
.doc-box .doc-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; gap: 8px; }
.toast {
  position: fixed; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); right: 16px; left: auto; background: var(--toast-bg); color: var(--toast-fg); padding: 10px 16px;
  border-radius: 8px; box-shadow: 0 6px 20px var(--shadow); z-index: 50; max-width: min(420px, calc(100vw - 32px));
}
.hbar { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
.hbar .lbl { width: min(220px, 35%); font-size: 12.5px; }
.hbar .track { flex: 1; background: var(--gray-soft); height: 16px; border-radius: 4px; overflow: hidden; }
.hbar .fill { height: 100%; background: var(--accent); }
.hbar .val { width: 90px; text-align: right; font-size: 12.5px; font-weight: 600; }
.big-number { font-size: 30px; font-weight: 800; }
.modal-backdrop { position: fixed; inset: 0; background: var(--shadow); display: grid; place-items: center; z-index: 60; padding: 16px; }
.modal { background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 10px; padding: 20px; max-width: 460px; width: 100%; box-shadow: 0 12px 40px var(--shadow); }
.modal p { margin: 0 0 4px; }
@media (max-width: 900px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } .kv { grid-template-columns: 1fr; } .topbar { gap: 10px; padding: 10px 16px; } .brand .muted { display: none; } }

</style>

<script>window.APPEALS_DATA = {"seed_order":["tka_prior_auth","lumbar_mri","knee_scope_coding","rotator_cuff_timely","spine_fusion"],"samples":{"tka_prior_auth":{"meta":{"key":"tka_prior_auth","title":"Total knee arthroplasty - prior auth denied","label":"Total knee replacement (prior auth) - strong","practice_id":1,"dates":{"INJ1":-240,"PT_START":-205,"PT_END":-118,"XRAY":-120,"INJ2":-95,"CONSULT":-30,"PA_REQUEST":-16,"DENIAL_DATE":-9,"PLANNED_DOS":21},"seed_state":{"status":"New"}},"docs":{"denial_letter":"*** FICTIONAL DOCUMENT - PROTOTYPE DEMONSTRATION ONLY ***\n\nSUMMIT HEALTH PLAN\nUtilization Management Department\nPO Box 4400, Lakemont, ST 00000   |   Fax (555) 010-4471\n\nNOTICE OF ADVERSE DETERMINATION - PRIOR AUTHORIZATION\n\nDate of notice: {{DENIAL_DATE}}\n\nTo: Elena Marsh, MD - Riverbend Orthopedic Associates\nMember: Dorothy Kessler          DOB: 03/14/1958\nMember ID: SHP-448210937          Group: 77120\nAuthorization reference #: SHP-PA-118734\nRequested service: Total knee arthroplasty, right knee (CPT 27447-RT)\nDiagnosis: M17.11 Unilateral primary osteoarthritis, right knee\nRequested date of service: {{PLANNED_DOS}}\nFacility: Riverbend Surgery Center (in network)\n\nDETERMINATION: DENIED\n\nReason for denial (denial code PA-DN-14 - Clinical criteria not met / insufficient documentation):\nSummit Health Plan reviewed the request against Medical Policy MP-ORTHO-031, Total Knee\nArthroplasty. The policy requires documented failure of at least 12 weeks of non-operative\ntreatment within the past 12 months (Criterion 3). The records submitted reference prior\nphysical therapy, but no physical therapy notes were provided documenting the dates,\nfrequency, duration or response to therapy. The reviewer was unable to confirm that\nCriterion 3 was met. All other criteria were not evaluated in full because Criterion 3 was\nnot met.\n\nThis decision was made by a licensed physician reviewer (Board certified, Orthopaedic Surgery).\n\nYOUR RIGHT TO APPEAL\nYou or the member may request an appeal within 60 calendar days of the date of this notice.\nSubmit the appeal with any additional medical records that support the request to:\n  Summit Health Plan - Appeals Unit, PO Box 4410, Lakemont, ST 00000\n  Fax: (555) 010-4480   |   Provider portal: Appeals > New pre-service appeal\nStandard pre-service appeals are decided within 30 calendar days. A peer-to-peer review may\nbe requested within 14 days of this notice by calling (555) 010-4400.\n","clinical_notes":"*** FICTIONAL CLINICAL RECORD - PROTOTYPE DEMONSTRATION ONLY ***\nPatient: Dorothy Kessler   DOB: 03/14/1958   MRN: RB-20931\n\n=====================================================================\nNOTE 1 - INJECTION PROCEDURE NOTE - {{INJ1}}\nProvider: Elena Marsh, MD\nProcedure: Right knee intra-articular corticosteroid injection (triamcinolone 40 mg +\nlidocaine), ultrasound guided. Indication: right knee osteoarthritis with persistent pain\ndespite oral NSAIDs (meloxicam 15 mg daily since about 9 months ago). Tolerated well.\nPlan: start formal physical therapy; follow up in 3 months.\n\n=====================================================================\nNOTE 2 - NORTHGATE PHYSICAL THERAPY - DISCHARGE SUMMARY - {{PT_END}}\nTherapist: Jordan Pell, PT, DPT  (Northgate Physical Therapy - outside facility)\nReferral: Right knee OA, Dr. E. Marsh\nPlan of care: 2x/week x 12 weeks. Start of care: {{PT_START}}. Discharge: {{PT_END}}.\nVisits attended: 14 of 16 scheduled (2 cancellations due to pain flare).\nInterventions: quadriceps/hip strengthening, ROM, gait training, aquatic therapy x 4,\nhome exercise program (HEP) issued and reviewed at each visit.\nOutcome: Initial KOOS JR 48.0 -> discharge KOOS JR 46.5 (no meaningful change).\nPain 7/10 -> 7/10 with stairs. ROM right knee 5-105 deg (unchanged).\nAssessment: Patient participated fully but plateaued with persistent pain and functional\nlimitation. Discharged to HEP. Recommend orthopedic follow-up for surgical consideration.\n\n=====================================================================\nNOTE 3 - X-RAY REPORT - RIGHT KNEE, 3 VIEWS WEIGHT-BEARING - {{XRAY}}\nRadiologist: K. Osei, MD\nFindings: Severe medial compartment joint space narrowing with bone-on-bone apposition.\nLarge marginal osteophytes, subchondral sclerosis and subchondral cysts. Moderate\npatellofemoral narrowing. Mild varus alignment (approx. 6 deg).\nImpression: Severe tricompartmental osteoarthritis, medial predominant,\nKellgren-Lawrence grade 4.\n\n=====================================================================\nNOTE 4 - INJECTION PROCEDURE NOTE - {{INJ2}}\nProvider: Elena Marsh, MD\nProcedure: Repeat right knee corticosteroid injection, ultrasound guided.\nPatient reports relief from prior injection lasted about 5 weeks. PT completed without\nimprovement. Continues meloxicam 15 mg daily and uses a cane for community distances.\n\n=====================================================================\nNOTE 5 - SURGICAL CONSULTATION - {{CONSULT}}\nProvider: Elena Marsh, MD\nHPI: 66-year-old woman with right knee pain for more than 3 years, progressively worse.\nPain 8/10, worse with stairs and standing more than 15 minutes; night pain 4-5 nights/week.\nWalking tolerance under 1 block. Uses a cane. Difficulty with stairs, getting in and out of\na car and grocery shopping. KOOS JR today: 44.8.\nNon-operative treatment to date: meloxicam 15 mg daily (more than 12 months), activity\nmodification and cane, 2 corticosteroid injections ({{INJ1}}, {{INJ2}}), formal PT at\nNorthgate PT {{PT_START}} to {{PT_END}} (14 visits) with HEP, without lasting benefit.\nWeight counseling provided (BMI 31.4); patient lost 9 lb over 6 months.\nPMH: Type 2 diabetes (HbA1c 6.4% two months ago), hypertension (controlled).\nNever smoker. No history of knee infection. Skin intact.\nExam: Antalgic gait, varus deformity, medial joint-line tenderness, small effusion,\nROM 5-100 deg, crepitus. Stable ligaments. Neurovascularly intact.\nImaging: Weight-bearing X-rays from {{XRAY}} reviewed; KL grade 4 medial, bone on bone.\nAssessment: End-stage primary OA right knee (M17.11) that has failed more than 12 weeks of\ncomprehensive non-operative management.\nPlan: Right total knee arthroplasty. Risks, benefits and alternatives discussed; shared\ndecision-making completed and the patient wishes to proceed. Medical clearance requested.\n","claim_data":"*** FICTIONAL DATA - PROTOTYPE DEMONSTRATION ONLY ***\n\nPRIOR AUTHORIZATION REQUEST SUMMARY (from practice management system)\nPractice: Riverbend Orthopedic Associates  |  NPI: 0000000001 (placeholder)\nRendering surgeon: Elena Marsh, MD (Orthopaedic Surgery - Adult Reconstruction)\n\nPatient: Dorothy Kessler   DOB: 03/14/1958   Sex: F\nPayer: Summit Health Plan   Member ID: SHP-448210937   Group: 77120\nAuthorization reference #: SHP-PA-118734\nPA request submitted: {{PA_REQUEST}} via payer portal\nRecords attached to original request: Surgical consult note ({{CONSULT}}), Knee X-ray report ({{XRAY}})\nRecords NOT attached: Northgate Physical Therapy notes, injection procedure notes\n\nRequested services\nLine  CPT    Mod  Description                                   ICD-10   Est. charge\n1     27447  RT   Arthroplasty, knee, condyle and plateau;     M17.11   $6,850.00\n                  medial AND lateral compartments (TKA)\n2     Facility fee - Riverbend Surgery Center (est.)                  M17.11   $29,950.00\n\nTotal estimated charges: $36,800.00\nPlanned date of service: {{PLANNED_DOS}}\nPlace of service: 24 (Ambulatory surgical center)\n","payer_policy":"*** ILLUSTRATIVE POLICY - FICTIONAL PAYER - NOT A REAL COVERAGE POLICY ***\n\nSUMMIT HEALTH PLAN\nMedical Policy MP-ORTHO-031: Total Knee Arthroplasty (Illustrative)\nEffective: 01/01 of current plan year\n\nSummit Health Plan considers primary total knee arthroplasty (CPT 27447) medically\nnecessary when ALL of the following criteria are met:\n\nCriterion 1 - Imaging. Weight-bearing radiographs within the past 12 months demonstrate\nadvanced arthritis: Kellgren-Lawrence grade 3 or 4, OR bone-on-bone articulation, OR\nsevere joint space narrowing.\n\nCriterion 2 - Function. Moderate to severe pain and functional impairment interfering with\nactivities of daily living for at least 3 months, documented with a validated outcome\nmeasure (e.g., KOOS JR, WOMAC) or a detailed functional description.\n\nCriterion 3 - Conservative care. Failure of at least 12 weeks of non-operative treatment\nwithin the past 12 months, including at least TWO of the following:\n  a) supervised physical therapy or a documented home exercise program;\n  b) NSAIDs or other analgesics, unless contraindicated;\n  c) intra-articular injection (corticosteroid or viscosupplement);\n  d) weight-loss counseling when BMI is 30 or greater; activity modification or an\n     assistive device.\nDocumentation must include dates and response to treatment. Physical therapy must be\nsupported by therapy notes or a discharge summary.\n\nCriterion 4 - BMI below 40, or a documented optimization plan.\n\nCriterion 5 - No active local or systemic infection; for patients with diabetes, HbA1c\nbelow 8.0% within the past 3 months.\n\nCriterion 6 - Documented shared decision-making between the surgeon and the patient.\n"},"canned":{"intake":"{\n  \"patient_name\": \"Dorothy Kessler\",\n  \"patient_dob\": \"1958-03-14\",\n  \"member_id\": \"SHP-448210937\",\n  \"payer_name\": \"Summit Health Plan\",\n  \"claim_or_reference_number\": \"SHP-PA-118734\",\n  \"rendering_provider\": \"Elena Marsh, MD\",\n  \"procedure_description\": \"Right total knee arthroplasty (pre-service prior authorization)\",\n  \"cpt_codes\": [\n    {\"code\": \"27447\", \"description\": \"Arthroplasty, knee, condyle and plateau; medial and lateral compartments (total knee arthroplasty)\", \"modifiers\": [\"RT\"]}\n  ],\n  \"icd10_codes\": [\n    {\"code\": \"M17.11\", \"description\": \"Unilateral primary osteoarthritis, right knee\"}\n  ],\n  \"date_of_service\": \"{{PLANNED_DOS|iso}}\",\n  \"denial_date\": \"{{DENIAL_DATE|iso}}\",\n  \"billed_amount\": 36800,\n  \"amount_at_stake\": 36800,\n  \"stated_denial_reason\": \"Insufficient documentation of conservative therapy: the request referenced prior physical therapy, but no PT notes documenting dates, frequency, duration or response were provided, so Criterion 3 of MP-ORTHO-031 could not be confirmed.\",\n  \"denial_codes\": [\n    {\"code\": \"PA-DN-14\", \"description\": \"Clinical criteria not met / insufficient documentation\"}\n  ],\n  \"appeal_window_days\": 60,\n  \"appeal_submission_method\": \"Summit Health Plan Appeals Unit, PO Box 4410, Lakemont, ST 00000; fax (555) 010-4480; or provider portal (Appeals > New pre-service appeal). Peer-to-peer available within 14 days at (555) 010-4400.\",\n  \"summary\": \"Pre-service prior authorization for a right TKA (27447-RT) was denied because PT documentation was not included with the request. The Northgate PT discharge summary and injection notes exist in the chart but were not sent.\"\n}\n","triage":"{\n  \"denial_type\": \"prior_authorization\",\n  \"denial_type_rationale\": \"Pre-service authorization for 27447 was denied under the payer's TKA medical policy (PA-DN-14) before surgery was performed.\",\n  \"winnability\": \"strong\",\n  \"winnability_score\": 88,\n  \"reasons_for\": [\n    \"The denial rests solely on missing PT documentation; a Northgate PT discharge summary documents 14 visits over about 12 weeks with no improvement (KOOS JR 48.0 to 46.5).\",\n    \"Conservative care far exceeds the two-modality minimum: NSAIDs for more than 12 months, two corticosteroid injections, PT with HEP, cane, and weight counseling.\",\n    \"Weight-bearing X-rays show KL grade 4 bone-on-bone medial OA, meeting the imaging criterion.\",\n    \"BMI 31.4, HbA1c 6.4%, never smoker and documented shared decision-making satisfy the remaining criteria.\"\n  ],\n  \"reasons_against\": [\n    \"The payer did not evaluate criteria 1, 2 and 4-6 in full, so it could raise new issues on appeal.\",\n    \"The HbA1c date should be confirmed as within 3 months of the planned surgery date.\"\n  ],\n  \"recommended_strategy\": \"File a standard pre-service appeal with the Northgate PT discharge summary and both injection notes attached, walking through all six MP-ORTHO-031 criteria. Consider requesting a peer-to-peer within the 14-day window to speed up approval before the planned surgery date.\",\n  \"route_to_coding_check\": false\n}\n","evidence":"{\n  \"policy_name\": \"Summit Health Plan MP-ORTHO-031: Total Knee Arthroplasty (illustrative)\",\n  \"criteria\": [\n    {\n      \"criterion\": \"Criterion 1 - Weight-bearing X-rays within 12 months show KL grade 3-4, bone-on-bone or severe joint space narrowing\",\n      \"status\": \"met\",\n      \"evidence\": \"3-view weight-bearing right knee X-rays on {{XRAY}} show severe medial narrowing with bone-on-bone apposition, KL grade 4.\",\n      \"citation\": {\"document\": \"clinical_notes\", \"section\": \"Note 3 - X-ray report {{XRAY}}\", \"excerpt\": \"Severe tricompartmental osteoarthritis, medial predominant, Kellgren-Lawrence grade 4.\"},\n      \"action_needed\": \"None - the report was included in the original request.\"\n    },\n    {\n      \"criterion\": \"Criterion 2 - Moderate-severe pain and functional impairment for 3+ months, documented with a validated measure\",\n      \"status\": \"met\",\n      \"evidence\": \"Pain 8/10 for more than 3 years, walking tolerance under 1 block, cane use, night pain; KOOS JR 44.8 at the surgical consult.\",\n      \"citation\": {\"document\": \"clinical_notes\", \"section\": \"Note 5 - Surgical consultation {{CONSULT}}\", \"excerpt\": \"Walking tolerance under 1 block. Uses a cane... KOOS JR today: 44.8.\"},\n      \"action_needed\": \"None.\"\n    },\n    {\n      \"criterion\": \"Criterion 3 - Failure of 12+ weeks of non-operative treatment in the past 12 months, including at least two modalities, with PT supported by therapy notes\",\n      \"status\": \"missing_documentation\",\n      \"evidence\": \"The chart documents PT {{PT_START}} to {{PT_END}} (14 visits, about 12 weeks, plateaued), meloxicam for more than 12 months, and corticosteroid injections on {{INJ1}} and {{INJ2}}. The PT discharge summary was NOT sent with the original request, which is the stated reason for the denial.\",\n      \"citation\": {\"document\": \"clinical_notes\", \"section\": \"Note 2 - Northgate PT discharge summary {{PT_END}}\", \"excerpt\": \"Visits attended: 14 of 16 scheduled... Patient participated fully but plateaued with persistent pain and functional limitation.\"},\n      \"action_needed\": \"Attach the Northgate PT discharge summary and both injection procedure notes; once attached, this criterion is met.\"\n    },\n    {\n      \"criterion\": \"Criterion 4 - BMI below 40 or a documented optimization plan\",\n      \"status\": \"met\",\n      \"evidence\": \"BMI 31.4 with weight counseling and a 9 lb weight loss documented.\",\n      \"citation\": {\"document\": \"clinical_notes\", \"section\": \"Note 5 - Surgical consultation {{CONSULT}}\", \"excerpt\": \"Weight counseling provided (BMI 31.4); patient lost 9 lb over 6 months.\"},\n      \"action_needed\": \"None.\"\n    },\n    {\n      \"criterion\": \"Criterion 5 - No active infection; HbA1c below 8.0% within 3 months for diabetic patients\",\n      \"status\": \"met\",\n      \"evidence\": \"HbA1c 6.4% about 2 months before the consult; no history of knee infection; skin intact.\",\n      \"citation\": {\"document\": \"clinical_notes\", \"section\": \"Note 5 - Surgical consultation {{CONSULT}}\", \"excerpt\": \"Type 2 diabetes (HbA1c 6.4% two months ago)... No history of knee infection. Skin intact.\"},\n      \"action_needed\": \"Attach the HbA1c lab result; confirm it falls within 3 months of the surgery date or repeat it at pre-op.\"\n    },\n    {\n      \"criterion\": \"Criterion 6 - Documented shared decision-making\",\n      \"status\": \"met\",\n      \"evidence\": \"The consult documents a risks/benefits/alternatives discussion and the patient's decision to proceed.\",\n      \"citation\": {\"document\": \"clinical_notes\", \"section\": \"Note 5 - Surgical consultation {{CONSULT}}\", \"excerpt\": \"Risks, benefits and alternatives discussed; shared decision-making completed and the patient wishes to proceed.\"},\n      \"action_needed\": \"None.\"\n    }\n  ],\n  \"overall_assessment\": \"Every MP-ORTHO-031 criterion is supported by the chart. The denial resulted from a documentation gap (PT notes not sent), not from a clinical shortfall. With the PT discharge summary and injection notes attached, all six criteria are met.\",\n  \"documents_to_attach\": [\n    \"Northgate Physical Therapy discharge summary ({{PT_END}})\",\n    \"Injection procedure notes ({{INJ1}} and {{INJ2}})\",\n    \"Surgical consultation note ({{CONSULT}})\",\n    \"Weight-bearing right knee X-ray report ({{XRAY}})\",\n    \"HbA1c lab result\"\n  ],\n  \"gaps\": [\n    \"HbA1c lab report is referenced but not in the uploaded record.\",\n    \"The PT plan of care called for 16 visits and 14 were attended; frame this as full participation with a plateau.\"\n  ]\n}\n","drafting":"{\n  \"subject_line\": \"Pre-service appeal - Dorothy Kessler - Auth ref SHP-PA-118734 - Right TKA (27447-RT)\",\n  \"letter_text\": \"@letter.txt\",\n  \"key_arguments\": [\n    \"The denial was based only on missing PT documentation; the enclosed Northgate PT discharge summary documents 14 visits over about 12 weeks with no functional improvement.\",\n    \"The patient failed four conservative modalities within 12 months: PT with HEP, NSAIDs, two corticosteroid injections, and activity modification with a cane plus weight counseling.\",\n    \"Weight-bearing X-rays show KL grade 4 bone-on-bone medial osteoarthritis (Criterion 1).\",\n    \"Severe functional limitation is documented with KOOS JR 44.8 and walking tolerance under 1 block (Criterion 2).\",\n    \"BMI 31.4, HbA1c 6.4%, no infection, and documented shared decision-making satisfy Criteria 4-6.\"\n  ],\n  \"enclosures\": [\n    \"Northgate Physical Therapy discharge summary ({{PT_END}})\",\n    \"Injection procedure notes ({{INJ1}} and {{INJ2}})\",\n    \"Surgical consultation note, Elena Marsh, MD ({{CONSULT}})\",\n    \"Weight-bearing right knee X-ray report ({{XRAY}})\",\n    \"HbA1c laboratory result\",\n    \"Copy of the denial notice dated {{DENIAL_DATE}}\"\n  ]\n}\n","qa":"{\n  \"overall\": \"ready_with_edits\",\n  \"score\": 91,\n  \"flags\": [\n    {\"severity\": \"medium\", \"issue\": \"The HbA1c lab result is cited as Enclosure 5 but is not in the uploaded documents.\", \"location\": \"Criteria 4 through 6 paragraph; Enclosure 5\", \"suggested_fix\": \"Pull the HbA1c result from the chart and attach it, and confirm the draw date is within 3 months of the planned surgery.\"},\n    {\"severity\": \"low\", \"issue\": \"The signature and practice phone placeholders still need to be filled in.\", \"location\": \"Signature block\", \"suggested_fix\": \"Have Dr. Marsh sign, and add the practice phone number.\"},\n    {\"severity\": \"low\", \"issue\": \"The peer-to-peer window (14 days from the notice) is still open.\", \"location\": \"Closing paragraph\", \"suggested_fix\": \"Consider scheduling a peer-to-peer in parallel to speed approval before the planned surgery date.\"}\n  ],\n  \"unsupported_claims\": [],\n  \"attachments_checklist\": [\n    {\"item\": \"Northgate PT discharge summary ({{PT_END}})\", \"source\": \"clinical_notes - Note 2\", \"required\": true, \"status\": \"in_file\"},\n    {\"item\": \"Injection procedure notes ({{INJ1}}, {{INJ2}})\", \"source\": \"clinical_notes - Notes 1 and 4\", \"required\": true, \"status\": \"in_file\"},\n    {\"item\": \"Surgical consultation note ({{CONSULT}})\", \"source\": \"clinical_notes - Note 5\", \"required\": true, \"status\": \"in_file\"},\n    {\"item\": \"Weight-bearing X-ray report ({{XRAY}})\", \"source\": \"clinical_notes - Note 3\", \"required\": true, \"status\": \"in_file\"},\n    {\"item\": \"HbA1c laboratory result\", \"source\": \"Practice EHR - labs\", \"required\": true, \"status\": \"needs_upload\"},\n    {\"item\": \"Copy of denial notice ({{DENIAL_DATE}})\", \"source\": \"denial_letter\", \"required\": false, \"status\": \"in_file\"}\n  ],\n  \"summary\": \"Strong, well-supported letter that directly cures the stated denial reason and addresses all six policy criteria. Before submitting: attach the HbA1c result, sign, and fill in the phone placeholder.\"\n}\n"},"letter":"Riverbend Orthopedic Associates\n1200 Riverbend Parkway, Suite 300\nFairhaven, ST 00000\n\n{{TODAY|long}}\n\nSummit Health Plan - Appeals Unit\nPO Box 4410\nLakemont, ST 00000\nVia fax: (555) 010-4480\n\nRE: Request for reconsideration - pre-service prior authorization\nMember: Dorothy Kessler    DOB: 03/14/1958    Member ID: SHP-448210937\nAuthorization reference #: SHP-PA-118734\nRequested service: Right total knee arthroplasty, CPT 27447-RT\nDiagnosis: M17.11 Unilateral primary osteoarthritis, right knee\nPlanned date of service: {{PLANNED_DOS|long}}\nDate of denial: {{DENIAL_DATE|long}}\n\nDear Appeals Reviewer:\n\nOn behalf of my patient, Ms. Dorothy Kessler, I request reconsideration and reversal of the\ndenial dated {{DENIAL_DATE|long}} for a right total knee arthroplasty. The denial states that\nCriterion 3 of Medical Policy MP-ORTHO-031 could not be confirmed because physical therapy\nnotes were not provided. Those records are enclosed and confirm that Ms. Kessler meets every\ncriterion of the policy.\n\nCriterion 3 - Failure of at least 12 weeks of non-operative treatment. Within the past 12\nmonths Ms. Kessler completed supervised physical therapy at Northgate Physical Therapy from\n{{PT_START|long}} to {{PT_END|long}}, attending 14 visits with a home exercise program. Her\ntherapist documented that she \"participated fully but plateaued,\" with KOOS JR essentially\nunchanged (48.0 to 46.5) and pain still 7/10 on stairs (Enclosure 1). In addition, she has\ntaken meloxicam 15 mg daily for more than 12 months, received ultrasound-guided corticosteroid\ninjections on {{INJ1|long}} and {{INJ2|long}} with only about five weeks of relief\n(Enclosure 2), uses a cane, and has received weight-loss counseling. This exceeds the policy's\nrequirement of at least two modalities.\n\nCriterion 1 - Imaging. Weight-bearing radiographs dated {{XRAY|long}} show severe medial\ncompartment narrowing with bone-on-bone apposition, Kellgren-Lawrence grade 4 (Enclosure 4).\n\nCriterion 2 - Function. Ms. Kessler has had right knee pain for more than three years, now\n8/10, with night pain most nights, walking tolerance under one block, and difficulty with\nstairs and car transfers. Her KOOS JR score on {{CONSULT|long}} was 44.8 (Enclosure 3).\n\nCriteria 4 through 6. Her BMI is 31.4, below the policy threshold, with documented weight\nloss. Her diabetes is well controlled (HbA1c 6.4%, Enclosure 5), she has no history of\ninfection, and she has never smoked. Shared decision-making regarding risks, benefits and\nalternatives is documented in my consultation note.\n\nMs. Kessler has exhausted appropriate non-operative care and has end-stage osteoarthritis\nthat limits her daily activities. Total knee arthroplasty is the medically necessary next\nstep. Because surgery is planned for {{PLANNED_DOS|long}}, we respectfully ask for a timely\ndecision. I am available for a peer-to-peer discussion at your convenience.\n\nSincerely,\n\n[Surgeon signature]\nElena Marsh, MD\nOrthopaedic Surgery - Adult Reconstruction\nRiverbend Orthopedic Associates\nPhone: [Practice phone]\n\nEnclosures:\n1. Northgate Physical Therapy discharge summary ({{PT_END}})\n2. Injection procedure notes ({{INJ1}} and {{INJ2}})\n3. Surgical consultation note ({{CONSULT}})\n4. Weight-bearing right knee X-ray report ({{XRAY}})\n5. HbA1c laboratory result\n6. Copy of the denial notice dated {{DENIAL_DATE}}\n"},"lumbar_mri":{"meta":{"key":"lumbar_mri","title":"Lumbar MRI - medical necessity denial","label":"Lumbar MRI (medical necessity) - borderline","practice_id":1,"dates":{"ONSET":-100,"VISIT1":-92,"PT_START":-88,"PT_LAST":-66,"VISIT2":-63,"DOS":-62,"CLAIM_SUBMITTED":-58,"DENIAL_DATE":-50},"seed_state":{"status":"Ready for Review"}},"docs":{"denial_letter":"*** FICTIONAL DOCUMENT - PROTOTYPE DEMONSTRATION ONLY ***\n\nCRESTVIEW MUTUAL HEALTH\nExplanation of Benefits / Provider Remittance - Medical Necessity Denial\nNotice date: {{DENIAL_DATE}}\n\nProvider: Riverbend Orthopedic Associates - Samuel Okafor, MD\nPatient: Raymond Toller     DOB: 08/02/1978     Member ID: CMH-30219844\nClaim #: CMH-25-7781203      Date of service: {{DOS}}\n\nLine 1  CPT 72148  MRI lumbar spine without contrast\n        Billed: $1,850.00   Allowed: $0.00   Paid: $0.00\n        CARC 50 - These are non-covered services because this is not deemed a \"medical\n        necessity\" by the payer.\n        RARC N115 - This decision was based on a Local/Plan Clinical Guideline.\n\nReviewer comment: Per Clinical Guideline CG-RAD-12 (Lumbar Spine MRI), advanced imaging\nfor low back pain with radiculopathy requires at least 6 weeks of documented conservative\ntherapy unless red-flag findings are present. The records show symptom duration of less\nthan 6 weeks and no red-flag findings were identified. Not medically necessary.\n\nAPPEAL RIGHTS: A first-level provider appeal must be received within 60 days of the date\nof this notice. Send a written appeal with supporting medical records to:\nCrestview Mutual Health, Provider Appeals, 88 Harbor Row, Brookfield, ST 00000,\nor upload via the CrestLink provider portal.\n","clinical_notes":"*** FICTIONAL CLINICAL RECORD - PROTOTYPE DEMONSTRATION ONLY ***\nPatient: Raymond Toller   DOB: 08/02/1978   MRN: RB-44812\n\n=====================================================================\nNOTE 1 - NEW PATIENT VISIT (SPINE) - {{VISIT1}}\nProvider: Samuel Okafor, MD\nHPI: 47-year-old warehouse supervisor with low back pain radiating down the left leg to\nthe dorsum of the foot since a lifting episode on about {{ONSET}}. Pain 7/10, worse with\nsitting. No bowel/bladder changes, no saddle anesthesia, no fever, no weight loss, no\nhistory of cancer.\nExam: Positive straight-leg raise on the left at 40 deg. Decreased light-touch sensation in\nthe left L5 dermatome. Strength 5/5 throughout, including left EHL and ankle dorsiflexion.\nReflexes symmetric.\nAssessment: Acute left L5 radiculopathy, likely disc herniation.\nPlan: Naproxen 500 mg twice daily, methylprednisolone dose pack, physical therapy 2x/week,\nactivity modification and work restrictions. Return in 4 weeks or sooner if weakness.\n\n=====================================================================\nNOTE 2 - PHYSICAL THERAPY PROGRESS NOTE - {{PT_LAST}}\nTherapist: A. Brandt, PT (Riverbend in-house PT)\nVisits to date: 6 (start of care {{PT_START}}). McKenzie extension protocol, core\nstabilization, neural glides. Patient reports no centralization; leg pain unchanged 6-7/10.\nNotes new difficulty with heel walking on the left at today's visit. Recommended that the\npatient follow up with the physician before next visit.\n\n=====================================================================\nNOTE 3 - FOLLOW-UP VISIT - {{VISIT2}}\nProvider: Samuel Okafor, MD\nInterval: About 5 weeks since symptom onset; completed oral steroids, on naproxen, 6 PT\nvisits. Leg pain persistent 7/10; new subjective weakness (\"foot slaps when tired\").\nExam: Left EHL 4/5 (previously 5/5), left ankle dorsiflexion 4+/5 (previously 5/5).\nPositive SLR left at 35 deg. Diminished L5 sensation unchanged. No saddle anesthesia.\nAssessment: Left L5 radiculopathy with NEW motor deficit (EHL and dorsiflexion weakness),\nprogressing since the initial exam despite conservative care.\nPlan: MRI lumbar spine without contrast to evaluate for a compressive lesion and guide\npossible epidural steroid injection or surgical referral. Continue PT and naproxen.\n\n=====================================================================\nNOTE 4 - MRI LUMBAR SPINE WITHOUT CONTRAST - {{DOS}}\nRadiologist: L. Fennimore, MD\nFindings: L4-5 left paracentral disc extrusion (9 mm) with caudal migration compressing\nthe traversing left L5 nerve root in the lateral recess. Mild facet arthropathy L4-5 and\nL5-S1. No fracture, no marrow-replacing lesion. Conus normal.\nImpression: L4-5 left paracentral extrusion with compression of the left L5 nerve root,\nconcordant with the clinical presentation.\n","claim_data":"*** FICTIONAL DATA - PROTOTYPE DEMONSTRATION ONLY ***\n\nCLAIM SUMMARY (CMS-1500 data from practice management system)\nBilling provider: Riverbend Orthopedic Associates (in-office imaging)\nRendering / ordering provider: Samuel Okafor, MD (Orthopaedic Spine)\nPatient: Raymond Toller   DOB: 08/02/1978   Sex: M\nPayer: Crestview Mutual Health   Member ID: CMH-30219844\nClaim #: CMH-25-7781203   Submitted: {{CLAIM_SUBMITTED}} (electronic)\nPrior authorization: Not required for this plan's in-office MRI at the time of service (per\npayer eligibility check on {{VISIT2}}; reference CMH-ELIG-55120).\n\nLine  DOS          CPT    Mod  ICD-10 pointers     Units  Charge\n1     {{DOS}}  72148  -    M54.16, M51.16      1      $1,850.00\n\nICD-10:\n  M54.16  Radiculopathy, lumbar region\n  M51.16  Intervertebral disc disorders with radiculopathy, lumbar region\n\nTotal billed: $1,850.00   Paid: $0.00   Patient responsibility: $0.00 (pending appeal)\n","payer_policy":"*** ILLUSTRATIVE POLICY - FICTIONAL PAYER - NOT A REAL COVERAGE POLICY ***\n\nCRESTVIEW MUTUAL HEALTH\nClinical Guideline CG-RAD-12: MRI of the Lumbar Spine (Illustrative)\n\nLumbar spine MRI (CPT 72148, 72149, 72158) is considered medically necessary for ONE of the\nfollowing indications:\n\nIndication A - Persistent low back pain with or without radiculopathy after at least 6\nweeks of documented conservative therapy in the past 6 months (e.g., physical therapy,\nmedication, activity modification), with continued symptoms, in a patient who is a\ncandidate for intervention.\n\nIndication B - Red-flag findings, for which no conservative-therapy period is required:\n  B1. Progressive or severe neurological deficit (e.g., new or worsening motor weakness);\n  B2. Suspected cauda equina syndrome;\n  B3. Suspected infection, malignancy or fracture.\n\nIndication C - Pre-operative or pre-procedural planning (e.g., epidural steroid injection\nor surgery) once a procedure is being actively considered.\n\nDocumentation requirements: Office notes must describe symptom duration, conservative\ntreatments and their dates, and the neurological examination. When Indication B1 is used,\nthe notes should document the progression (comparison of serial examinations).\n"},"canned":{"intake":"{\n  \"patient_name\": \"Raymond Toller\",\n  \"patient_dob\": \"1978-08-02\",\n  \"member_id\": \"CMH-30219844\",\n  \"payer_name\": \"Crestview Mutual Health\",\n  \"claim_or_reference_number\": \"CMH-25-7781203\",\n  \"rendering_provider\": \"Samuel Okafor, MD\",\n  \"procedure_description\": \"MRI lumbar spine without contrast\",\n  \"cpt_codes\": [{\"code\": \"72148\", \"description\": \"MRI, spinal canal and contents, lumbar; without contrast material\", \"modifiers\": []}],\n  \"icd10_codes\": [\n    {\"code\": \"M54.16\", \"description\": \"Radiculopathy, lumbar region\"},\n    {\"code\": \"M51.16\", \"description\": \"Intervertebral disc disorders with radiculopathy, lumbar region\"}\n  ],\n  \"date_of_service\": \"{{DOS|iso}}\",\n  \"denial_date\": \"{{DENIAL_DATE|iso}}\",\n  \"billed_amount\": 1850,\n  \"amount_at_stake\": 1850,\n  \"stated_denial_reason\": \"Not medically necessary under CG-RAD-12: symptom duration was under 6 weeks of conservative therapy and no red-flag findings were identified.\",\n  \"denial_codes\": [\n    {\"code\": \"CARC 50\", \"description\": \"Non-covered: not deemed a medical necessity by the payer\"},\n    {\"code\": \"RARC N115\", \"description\": \"Decision based on a Local/Plan Clinical Guideline\"}\n  ],\n  \"appeal_window_days\": 60,\n  \"appeal_submission_method\": \"Crestview Mutual Health, Provider Appeals, 88 Harbor Row, Brookfield, ST 00000, or upload via the CrestLink provider portal.\",\n  \"summary\": \"A post-service lumbar MRI was denied for medical necessity because the payer saw under 6 weeks of conservative care and no red flags. The chart documents a new, progressive L5 motor deficit on the visit before the MRI.\"\n}\n","triage":"{\n  \"denial_type\": \"medical_necessity\",\n  \"denial_type_rationale\": \"Post-service claim denied with CARC 50 under the payer's imaging clinical guideline; no prior authorization was required.\",\n  \"winnability\": \"borderline\",\n  \"winnability_score\": 58,\n  \"reasons_for\": [\n    \"The follow-up note documents a NEW motor deficit (EHL 5/5 to 4/5, dorsiflexion 5/5 to 4+/5) compared with the initial exam, which is the red flag under Indication B1.\",\n    \"The PT note independently records new heel-walk difficulty, which corroborates the progression.\",\n    \"The MRI found a 9 mm extrusion compressing the L5 root, concordant with the deficit, and was used to plan intervention (Indication C).\"\n  ],\n  \"reasons_against\": [\n    \"Documented conservative care lasted about 4.3 weeks (about 5.4 weeks from symptom onset), short of Indication A's 6 weeks.\",\n    \"The motor deficit is mild (4/5 and 4+/5) and documented on a single follow-up exam, so a reviewer may not consider it 'progressive or severe'.\",\n    \"The payer's reviewer explicitly stated that no red flags were found, so the appeal must point them to the specific exam comparison.\"\n  ],\n  \"recommended_strategy\": \"Appeal under Indication B1 (progressive neurological deficit) with a side-by-side comparison of the {{VISIT1}} and {{VISIT2}} exams, the PT note corroborating the decline, and Indication C as a secondary basis. File quickly: the deadline is close.\",\n  \"route_to_coding_check\": false\n}\n","evidence":"{\n  \"policy_name\": \"Crestview Mutual Health CG-RAD-12: MRI of the Lumbar Spine (illustrative)\",\n  \"criteria\": [\n    {\n      \"criterion\": \"Indication A - At least 6 weeks of documented conservative therapy with persistent symptoms\",\n      \"status\": \"not_met\",\n      \"evidence\": \"Symptoms began about {{ONSET}}; conservative care (NSAIDs, oral steroids, 6 PT visits) is documented from {{VISIT1}}, about 4.3 weeks before the MRI on {{DOS}}.\",\n      \"citation\": {\"document\": \"clinical_notes\", \"section\": \"Note 3 - Follow-up visit {{VISIT2}}\", \"excerpt\": \"About 5 weeks since symptom onset; completed oral steroids, on naproxen, 6 PT visits.\"},\n      \"action_needed\": \"Do not rely on Indication A; argue Indication B1.\"\n    },\n    {\n      \"criterion\": \"Indication B1 - Progressive or severe neurological deficit, documented by comparing serial examinations\",\n      \"status\": \"met\",\n      \"evidence\": \"Initial exam {{VISIT1}}: strength 5/5 including left EHL and dorsiflexion. Follow-up {{VISIT2}}: left EHL 4/5 and dorsiflexion 4+/5, documented by the physician as a new motor deficit progressing despite conservative care.\",\n      \"citation\": {\"document\": \"clinical_notes\", \"section\": \"Note 3 - Follow-up visit {{VISIT2}}\", \"excerpt\": \"Left EHL 4/5 (previously 5/5), left ankle dorsiflexion 4+/5 (previously 5/5).\"},\n      \"action_needed\": \"Quote both exams side by side in the appeal.\"\n    },\n    {\n      \"criterion\": \"Corroborating documentation of progression\",\n      \"status\": \"met\",\n      \"evidence\": \"PT progress note on {{PT_LAST}} records new difficulty heel-walking on the left and refers the patient back to the physician.\",\n      \"citation\": {\"document\": \"clinical_notes\", \"section\": \"Note 2 - PT progress note {{PT_LAST}}\", \"excerpt\": \"Notes new difficulty with heel walking on the left at today's visit.\"},\n      \"action_needed\": \"Attach the PT progress note.\"\n    },\n    {\n      \"criterion\": \"Indication C - Pre-procedural planning once a procedure is actively considered\",\n      \"status\": \"missing_documentation\",\n      \"evidence\": \"The MRI order states it will 'guide possible epidural steroid injection or surgical referral', but no injection or surgical plan is documented afterward in the uploaded records.\",\n      \"citation\": {\"document\": \"clinical_notes\", \"section\": \"Note 3 - Follow-up visit {{VISIT2}}\", \"excerpt\": \"MRI... to evaluate for a compressive lesion and guide possible epidural steroid injection or surgical referral.\"},\n      \"action_needed\": \"If an ESI or surgical consult followed the MRI, attach that note to strengthen Indication C.\"\n    },\n    {\n      \"criterion\": \"No red flags for cauda equina, infection, malignancy or fracture (B2/B3)\",\n      \"status\": \"not_met\",\n      \"evidence\": \"The notes explicitly document no bowel/bladder change, no saddle anesthesia, no fever, weight loss or cancer history. B2/B3 do not apply.\",\n      \"citation\": {\"document\": \"clinical_notes\", \"section\": \"Note 1 - New patient visit {{VISIT1}}\", \"excerpt\": \"No bowel/bladder changes, no saddle anesthesia, no fever, no weight loss, no history of cancer.\"},\n      \"action_needed\": \"None - do not argue B2/B3.\"\n    }\n  ],\n  \"overall_assessment\": \"The case turns on Indication B1. Serial exams document a new motor deficit, which the policy explicitly lists as a red flag, and the MRI confirmed a concordant compressive lesion. The deficit is mild and was seen on one follow-up, so the outcome depends on the reviewer accepting it as 'progressive'.\",\n  \"documents_to_attach\": [\n    \"New patient visit note ({{VISIT1}}) - baseline 5/5 strength\",\n    \"Follow-up visit note ({{VISIT2}}) - new 4/5 EHL weakness\",\n    \"PT progress note ({{PT_LAST}})\",\n    \"MRI report ({{DOS}})\",\n    \"Any post-MRI ESI or surgical referral note\"\n  ],\n  \"gaps\": [\n    \"Conservative care is under 6 weeks, so Indication A cannot be used.\",\n    \"No post-MRI treatment plan is documented in the uploaded record.\"\n  ]\n}\n","drafting":"{\n  \"subject_line\": \"First-level appeal - Raymond Toller - Claim CMH-25-7781203 - MRI lumbar spine (72148)\",\n  \"letter_text\": \"@letter.txt\",\n  \"key_arguments\": [\n    \"CG-RAD-12 Indication B1 waives the 6-week conservative therapy requirement for a progressive neurological deficit.\",\n    \"Serial exams document new left EHL (5/5 to 4/5) and dorsiflexion (5/5 to 4+/5) weakness between {{VISIT1}} and {{VISIT2}}.\",\n    \"The physical therapist independently documented new heel-walk difficulty.\",\n    \"The MRI found a 9 mm L4-5 extrusion compressing the left L5 root, concordant with the deficit, and was ordered to plan intervention.\"\n  ],\n  \"enclosures\": [\n    \"New patient visit note ({{VISIT1}})\",\n    \"Follow-up visit note ({{VISIT2}})\",\n    \"Physical therapy progress note ({{PT_LAST}})\",\n    \"MRI lumbar spine report ({{DOS}})\",\n    \"Copy of the EOB dated {{DENIAL_DATE}}\"\n  ]\n}\n","qa":"{\n  \"overall\": \"ready_with_edits\",\n  \"score\": 82,\n  \"flags\": [\n    {\"severity\": \"high\", \"issue\": \"The appeal deadline is close; submit this week.\", \"location\": \"Case header\", \"suggested_fix\": \"Prioritize approval and send via the CrestLink portal for a time-stamped receipt.\"},\n    {\"severity\": \"medium\", \"issue\": \"The Indication C argument is thin: no post-MRI ESI or surgical referral is documented in the uploaded record.\", \"location\": \"Paragraph 5\", \"suggested_fix\": \"Attach the post-MRI plan if one exists; otherwise keep Indication C as a single supporting sentence (as drafted).\"},\n    {\"severity\": \"low\", \"issue\": \"Physician signature placeholder.\", \"location\": \"Signature block\", \"suggested_fix\": \"Have Dr. Okafor sign before submission.\"}\n  ],\n  \"unsupported_claims\": [],\n  \"attachments_checklist\": [\n    {\"item\": \"New patient visit note ({{VISIT1}})\", \"source\": \"clinical_notes - Note 1\", \"required\": true, \"status\": \"in_file\"},\n    {\"item\": \"Follow-up visit note ({{VISIT2}})\", \"source\": \"clinical_notes - Note 3\", \"required\": true, \"status\": \"in_file\"},\n    {\"item\": \"PT progress note ({{PT_LAST}})\", \"source\": \"clinical_notes - Note 2\", \"required\": true, \"status\": \"in_file\"},\n    {\"item\": \"MRI report ({{DOS}})\", \"source\": \"clinical_notes - Note 4\", \"required\": true, \"status\": \"in_file\"},\n    {\"item\": \"Post-MRI ESI or surgical referral note (if any)\", \"source\": \"Practice EHR\", \"required\": false, \"status\": \"verify\"},\n    {\"item\": \"Copy of EOB ({{DENIAL_DATE}})\", \"source\": \"denial_letter\", \"required\": false, \"status\": \"in_file\"}\n  ],\n  \"summary\": \"The letter correctly pivots from the 6-week rule to the red-flag exception and supports it with a serial-exam comparison. The facts all match the record. The outcome is uncertain because the deficit is mild; the timing is the main risk.\"\n}\n"},"letter":"Riverbend Orthopedic Associates\n1200 Riverbend Parkway, Suite 300\nFairhaven, ST 00000\n\n{{TODAY|long}}\n\nCrestview Mutual Health\nProvider Appeals\n88 Harbor Row\nBrookfield, ST 00000\n\nRE: First-level provider appeal - medical necessity\nPatient: Raymond Toller    DOB: 08/02/1978    Member ID: CMH-30219844\nClaim #: CMH-25-7781203    Date of service: {{DOS|long}}\nService: MRI lumbar spine without contrast, CPT 72148\nDiagnoses: M54.16, M51.16\nDenial date: {{DENIAL_DATE|long}} (CARC 50, RARC N115)\n\nDear Appeals Reviewer:\n\nWe request reversal of the medical necessity denial for the lumbar MRI performed on\n{{DOS|long}}. The denial states that no red-flag findings were identified. The enclosed\nrecords show that Mr. Toller developed a new and progressing motor deficit before the MRI\nwas ordered, which meets Clinical Guideline CG-RAD-12, Indication B1, \"Progressive or\nsevere neurological deficit (e.g., new or worsening motor weakness).\" Under Indication B1,\nno conservative-therapy period is required.\n\nSerial examinations document the progression, as the guideline requests:\n- {{VISIT1|long}} (Enclosure 1): strength 5/5 throughout, including the left extensor\n  hallucis longus and ankle dorsiflexion; left L5 sensory change only.\n- {{VISIT2|long}} (Enclosure 2): left EHL 4/5 and left ankle dorsiflexion 4+/5, with the\n  patient reporting that his \"foot slaps when tired.\" Dr. Okafor documented a \"NEW motor\n  deficit... progressing since the initial exam despite conservative care.\"\n\nHis treating physical therapist independently recorded new difficulty with heel walking\non the left on {{PT_LAST|long}} and referred him back to the physician (Enclosure 3).\nThis decline occurred despite oral steroids, scheduled naproxen, activity modification and\nsix physical therapy visits.\n\nThe MRI confirmed the clinical concern: a 9 mm left paracentral L4-5 disc extrusion\ncompressing the traversing left L5 nerve root, concordant with his deficit (Enclosure 4).\nThe study was ordered to determine whether epidural steroid injection or surgical referral\nwas needed, which is also consistent with Indication C (pre-procedural planning).\n\nA new motor deficit from nerve root compression is exactly the situation in which\nCG-RAD-12 calls for prompt imaging rather than waiting out a six-week course of therapy.\nWe respectfully request that the claim be reprocessed for payment.\n\nSincerely,\n\n[Physician signature]\nSamuel Okafor, MD\nOrthopaedic Spine Surgery\nRiverbend Orthopedic Associates\n\nEnclosures:\n1. New patient visit note ({{VISIT1}})\n2. Follow-up visit note ({{VISIT2}})\n3. Physical therapy progress note ({{PT_LAST}})\n4. MRI lumbar spine report ({{DOS}})\n5. Copy of the EOB dated {{DENIAL_DATE}}\n"},"knee_scope_coding":{"meta":{"key":"knee_scope_coding","title":"Knee arthroscopy - bundling/modifier denial","label":"Knee arthroscopy (coding/bundling) - strong","practice_id":1,"dates":{"CONSULT":-112,"MRI":-105,"DOS":-84,"CLAIM_SUBMITTED":-80,"DENIAL_DATE":-70,"SUBMITTED":-63,"OUTCOME":-21},"seed_state":{"status":"Closed","outcome":"Overturned","amount_recovered":2850,"approved_by":"M. Alvarez (Billing Lead)","submitted_offset":"SUBMITTED","outcome_offset":"OUTCOME"}},"docs":{"denial_letter":"*** FICTIONAL DOCUMENT - PROTOTYPE DEMONSTRATION ONLY ***\n\nPINNACLE CARE ALLIANCE\nProvider Remittance Advice / Explanation of Benefits\nRemit date: {{DENIAL_DATE}}\n\nPayee: Riverbend Orthopedic Associates\nRendering: Priya Raman, MD\nPatient: Victor Almeda    DOB: 11/21/1973    Member ID: PCA-77310925\nClaim #: PCA-2025-0943317     DOS: {{DOS}}     POS: 24\n\nLine  CPT     Mod  Billed      Allowed     Paid        Adj codes\n1     29881   RT   $5,900.00   $2,214.00   $1,771.20   CO-45, PR-2 (coinsurance $442.80)\n2     29876   RT   $2,850.00   $0.00       $0.00       CO-97, RARC M80\n\nCO-97: The benefit for this service is included in the payment/allowance for another\nservice/procedure that has already been adjudicated.\nM80: Not covered when performed during the same session/date as a previously processed\nservice for the patient.\n\nLine 2 was denied by an NCCI procedure-to-procedure edit (column 1: 29881, column 2: 29876,\nmodifier indicator 1).\n\nReconsideration / appeal: Submit a corrected claim or a written appeal with the operative\nreport within 90 days of this remittance. Pinnacle Care Alliance, Claims Reconsideration,\nPO Box 2290, Westvale, ST 00000, or via the Pinnacle provider portal.\n","clinical_notes":"*** FICTIONAL CLINICAL RECORD - PROTOTYPE DEMONSTRATION ONLY ***\nPatient: Victor Almeda   DOB: 11/21/1973   MRN: RB-38170\n\n=====================================================================\nNOTE 1 - CLINIC VISIT - {{CONSULT}}\nProvider: Priya Raman, MD\nRight knee medial joint-line pain with mechanical catching for 5 months, plus recurrent\ndiffuse swelling. Failed 8 weeks of PT and NSAIDs. Exam: medial joint-line tenderness,\npositive McMurray, moderate effusion, boggy synovium in suprapatellar region.\nPlan: MRI right knee.\n\n=====================================================================\nNOTE 2 - MRI RIGHT KNEE - {{MRI}}\nComplex tear of the posterior horn of the medial meniscus. Moderate joint effusion with\nmarked synovial thickening in the suprapatellar pouch and lateral gutter, consistent with\nproliferative synovitis. Lateral meniscus intact. Cruciate ligaments intact.\n\n=====================================================================\nNOTE 3 - OPERATIVE REPORT - {{DOS}}\nSurgeon: Priya Raman, MD      Facility: Riverbend Surgery Center\nPreoperative diagnosis: Right knee medial meniscus tear; proliferative synovitis.\nPostoperative diagnosis: Same.\nProcedures:\n  1. Right knee arthroscopic partial medial meniscectomy (medial compartment).\n  2. Right knee arthroscopic major synovectomy of the lateral compartment/lateral gutter,\n     suprapatellar pouch and patellofemoral compartment.\nFindings: Complex degenerative tear of the posterior horn of the medial meniscus.\nDiffuse hypertrophic, hyperemic synovitis involving the suprapatellar pouch, the\npatellofemoral compartment and the lateral gutter, separate from the medial compartment.\nThe lateral meniscus and articular cartilage of the lateral compartment are intact.\nDescription: Standard anterolateral and anteromedial portals were established, plus a\nsuperolateral portal for access to the suprapatellar pouch. In the MEDIAL compartment,\nthe unstable posterior horn tear was debrided with a basket and shaver to a stable rim\n(approximately 30% of the posterior horn removed). Attention was then turned to the\nSUPRAPATELLAR POUCH, PATELLOFEMORAL compartment and LATERAL gutter, where an extensive\nsynovectomy was performed with a 4.5 mm full-radius shaver and radiofrequency wand\nthrough the superolateral portal, removing the hypertrophic synovium. This added about\n25 minutes of operative time. No synovectomy was performed in the medial compartment.\nSpecimen: Synovium sent to pathology.\nEBL: Minimal. Complications: None.\n\n=====================================================================\nNOTE 4 - PATHOLOGY - {{DOS}}\nSynovium, right knee: chronic proliferative synovitis with villous hyperplasia. No\ncrystals. Negative for pigmented villonodular synovitis.\n","claim_data":"*** FICTIONAL DATA - PROTOTYPE DEMONSTRATION ONLY ***\n\nCLAIM SUMMARY (CMS-1500 data from practice management system)\nBilling provider: Riverbend Orthopedic Associates\nRendering: Priya Raman, MD (Sports Medicine / Arthroscopy)\nPatient: Victor Almeda   DOB: 11/21/1973   Sex: M\nPayer: Pinnacle Care Alliance   Member ID: PCA-77310925\nClaim #: PCA-2025-0943317   Submitted: {{CLAIM_SUBMITTED}}   POS: 24 (ASC)\n\nLine  DOS          CPT    Mod  ICD-10 pointers     Units  Charge\n1     {{DOS}}  29881  RT   M23.221             1      $5,900.00\n2     {{DOS}}  29876  RT   M65.861             1      $2,850.00\n\nICD-10:\n  M23.221  Derangement of posterior horn of medial meniscus due to old tear or injury,\n           right knee\n  M65.861  Other synovitis and tenosynovitis, right lower leg\n\nTotal billed: $8,750.00   Paid: $1,771.20   Denied: $2,850.00 (line 2)\nCoder note: No distinct-procedure modifier was appended to line 2 at original submission.\n","payer_policy":"*** ILLUSTRATIVE POLICY - FICTIONAL PAYER - NOT A REAL REIMBURSEMENT POLICY ***\n\nPINNACLE CARE ALLIANCE\nReimbursement Policy RP-114: Arthroscopic Knee Procedures (Illustrative)\n\nSection 3 - Bundled services. Pinnacle applies NCCI procedure-to-procedure (PTP) edits.\nLimited synovectomy (29875) and chondroplasty (29877) are included in the meniscectomy\ncodes 29880/29881 and are not separately reimbursed.\n\nSection 4 - Major synovectomy (29876) with meniscectomy. CPT 29876 is eligible for separate\nreimbursement with 29880/29881 only when ALL of the following apply:\n  4.1 the synovectomy is performed in compartment(s) separate from the compartment where\n      the meniscectomy was performed;\n  4.2 the operative report specifically documents the separate compartment(s) treated;\n  4.3 the claim line is billed with modifier XS (separate structure) or 59, and the\n      laterality modifier (RT/LT).\n\nSection 5 - Corrected claims. Corrected claims (frequency code 7) and appeals must be\nreceived within 90 days of the original remittance date. Include the operative report\nwhen billing modifier XS or 59.\n"},"canned":{"intake":"{\n  \"patient_name\": \"Victor Almeda\",\n  \"patient_dob\": \"1973-11-21\",\n  \"member_id\": \"PCA-77310925\",\n  \"payer_name\": \"Pinnacle Care Alliance\",\n  \"claim_or_reference_number\": \"PCA-2025-0943317\",\n  \"rendering_provider\": \"Priya Raman, MD\",\n  \"procedure_description\": \"Right knee arthroscopy: partial medial meniscectomy with major synovectomy\",\n  \"cpt_codes\": [\n    {\"code\": \"29881\", \"description\": \"Arthroscopy, knee, surgical; with meniscectomy (medial OR lateral), including debridement/shaving of articular cartilage, same or separate compartment(s)\", \"modifiers\": [\"RT\"]},\n    {\"code\": \"29876\", \"description\": \"Arthroscopy, knee, surgical; synovectomy, major, 2 or more compartments\", \"modifiers\": [\"RT\"]}\n  ],\n  \"icd10_codes\": [\n    {\"code\": \"M23.221\", \"description\": \"Derangement of posterior horn of medial meniscus due to old tear or injury, right knee\"},\n    {\"code\": \"M65.861\", \"description\": \"Other synovitis and tenosynovitis, right lower leg\"}\n  ],\n  \"date_of_service\": \"{{DOS|iso}}\",\n  \"denial_date\": \"{{DENIAL_DATE|iso}}\",\n  \"billed_amount\": 8750,\n  \"amount_at_stake\": 2850,\n  \"stated_denial_reason\": \"Line 2 (29876-RT) was denied as included in the paymen ": [\n    {\"cpt\": \"29881\", \"modifiers\": [\"RT\"], \"icd10\": [\"M23.221\"], \"billed\": 5900},\n    {\"cpt\": \"29876\", \"modifiers\": [\"RT\"], \"icd10\": [\"M65.861\"], \"billed\": 2850}\n  ],\n  \"corrected_lines\": [\n    {\"cpt\": \"29881\", \"modifiers\": [\"RT\"], \"icd10\": [\"M23.221\"], \"billed\": 5900},\n    {\"cpt\": \"29876\", \"modifiers\": [\"XS\", \"RT\"], \"icd10\": [\"M65.861\"], \"billed\": 2850}\n  ],\n  \"recommendation\": \"both\",\n  \"appeal_argument\": \"Per Pinnacle RP-114 Section 4, 29876 is separately reimbursable with 29881 when the synovectomy is performed in a separate compartment, the op note documents it, and XS/59 is billed. The operative report documents major synovectomy of the suprapatellar pouch, patellofemoral compartment and lateral gutter through a separate superolateral portal, and states that no synovectomy was performed in the medial compartment where the meniscectomy occurred. Line 2 has been corrected to 29876-XS-RT.\",\n  \"documentation_support\": \"Op note: 'major synovectomy of the lateral compartment/lateral gutter, suprapatellar pouch and patellofemoral compartment'; 'No synovectomy was performed in the medial compartment'; separate superolateral portal; about 25 minutes added. Pathology: chronic proliferative synovitis.\"\n}\n","drafting":"{\n  \"subject_line\": \"Corrected claim and reconsideration - Victor Almeda - Claim PCA-2025-0943317 - 29876-XS-RT\",\n  \"letter_text\": \"@letter.txt\",\n  \"key_arguments\": [\n    \"Line 2 is corrected to 29876-XS-RT; the original claim omitted the distinct-procedure modifier.\",\n    \"RP-114 Section 4 allows separate reimbursement when the synovectomy is in a separate compartment and documented.\",\n    \"The op note documents synovectomy of the suprapatellar pouch, patellofemoral compartment and lateral gutter only, separate from the medial meniscectomy.\",\n    \"Pathology confirms proliferative synovitis.\"\n  ],\n  \"enclosures\": [\"Corrected CMS-1500 (frequency code 7)\", \"Operative report ({{DOS}})\", \"Pathology report ({{DOS}})\", \"Copy of the remittance advice ({{DENIAL_DATE}})\"]\n}\n","qa":"{\n  \"overall\": \"ready\",\n  \"score\": 95,\n  \"flags\": [\n    {\"severity\": \"low\", \"issue\": \"Signature placeholder.\", \"location\": \"Signature block\", \"suggested_fix\": \"Sign before submission.\"}\n  ],\n  \"unsupported_claims\": [],\n  \"attachments_checklist\": [\n    {\"item\": \"Corrected CMS-1500 (frequency code 7) with 29876-XS-RT\", \"source\": \"Practice billing system\", \"required\": true, \"status\": \"needs_upload\"},\n    {\"item\": \"Operative report ({{DOS}})\", \"source\": \"clinical_notes - Note 3\", \"required\": true, \"status\": \"in_file\"},\n    {\"item\": \"Pathology report ({{DOS}})\", \"source\": \"clinical_notes - Note 4\", \"required\": false, \"status\": \"in_file\"},\n    {\"item\": \"Remittance advice ({{DENIAL_DATE}})\", \"source\": \"denial_letter\", \"required\": false, \"status\": \"in_file\"}\n  ],\n  \"summary\": \"Clean coding correction backed by explicit op-note language and the payer's own policy. Generate the corrected claim in the billing system and submit.\"\n}\n"},"letter":"Riverbend Orthopedic Associates\n1200 Riverbend Parkway, Suite 300\nFairhaven, ST 00000\n\n{{TODAY|long}}\n\nPinnacle Care Alliance\nClaims Reconsideration\nPO Box 2290\nWestvale, ST 00000\n\nRE: Corrected claim and request for reconsideration - line 2\nPatient: Victor Almeda    DOB: 11/21/1973    Member ID: PCA-77310925\nClaim #: PCA-2025-0943317    Date of service: {{DOS|long}}\nDenied line: CPT 29876-RT, $2,850.00 (CO-97, RARC M80)\nRemittance date: {{DENIAL_DATE|long}}\n\nDear Claims Reviewer:\n\nEnclosed is a corrected claim for the date of service above, with line 2 rebilled as\n29876-XS-RT. The original submission omitted the distinct-procedural-service modifier, so\nthe line was bundled into 29881 by the NCCI procedure-to-procedure edit. That edit carries\nmodifier indicator 1, and the d  Dr\nMesa Verde, ST 00000\nVia fax: (555) 010-7720\n\nRE: Appeal of prior authorization denial\nMember: Gerald Whitcomb    DOB: 01/30/1967    Member ID: MVH-60718832\nUM case #: MVH-UM-2025-40215\nRequested: L4-L5 TLIF - CPT 22633, 22853, 22840\nDiagnoses: M43.16, M48.062\nDenial date: {{DENIAL_DATE|long}}\n\nDear Appeals Reviewer:\n\nI request reversal of the denial of the L4-L5 fusion for my patient, Mr. Gerald Whitcomb.\nThe denial cited Criteria 1 and 5 of Medical Policy MVP-SP-07. Your reviewer agreed that\nCriteria 2, 3 and 4 are met. Both remaining criteria are also satisfied.\n\nCriterion 1 - Instability. MVP-SP-07 requires translation of 4 mm or more, OR angular\nmotion of 10 degrees or more, on flexion-extension radiographs. The denial considered only\ntranslation (3.5 mm). The same flexion-extension study dated {{FLEXEX|long}} documents\n\"sagittal angulation change at L4-5: 11 degrees between flexion and extension,\" and the\nradiologist's impression is segmental motion \"suggestive of instability\" (Enclosure 1).\nEleven degrees exceeds the 10-degree threshold, so Criterion 1 is met.\n\nCriterion 5 - Nicotine. Mr. Whitcomb stopped smoking on {{QUIT|long}}, more than six weeks\nbefore the planned surgery, and has used no nicotine replacement since his first three\nweeks. His cotinine test is negative (Enclosure 2), confirming abstinence as the policy\nrequires.\n\nFor completeness: Mr. Whitcomb has 14 months of neurogenic claudication with an ODI of 48%\nand walking tolerance of about one block. He failed 18 physical therapy visits, NSAIDs,\ngabapentin and two epidural steroid injections, and his MRI shows severe L4-5 central\nstenosis with grade I spondylolisthesis (Enclosures 3 and 4).\n\nAll five criteria of MVP-SP-07 are met. I request approval of the procedure and am\navailable for a peer-to-peer discussion.\n\nSincerely,\n\n[Surgeon signature]\nSamuel Okafor, MD\nOrthopaedic Spine Surgery\nRiverbend Orthopedic Associates\n\nEnclosures:\n1. Flexion-   const today = () => { const d = new Date(); d.setHours(12, 0, 0, 0); return d; };
  const parseIso = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d, 12); };
