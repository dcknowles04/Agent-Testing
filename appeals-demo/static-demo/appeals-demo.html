    });
  }
  const sampleDocs = (key, ctx) => Object.fromEntries(Object.entries(DATA.samples[key].docs).map(([k, v]) => [k, render(v, ctx)]));

  function canned(key, agent, ctx) {
    const raw = DATA.samples[key].canned[agent];
    if (!raw) return null;
    const data = JSON.parse(render(raw, ctx));
    if (typeof data.letter_text === "string" && data.letter_text.startsWith("@")) data.letter_text = render(DATA.samples[key].letter, ctx).trim();
    return data;
  }

  // ------------------------------------------------------------ generic template output (pasted docs)
  const NOTE = "Demo-mode template output (pattern matching, not AI). The full app with an API key gives a case-specific analysis.";
  const field = (text, ...labels) => {
    for (const l of labels) {
      const m = new RegExp(l.replace(/[#]/g, "\\#") + "\\s*[:#]\\s*([^\\n|]+?)(?:\\s{2,}|\\n|\\||$)", "i").exec(text || "");
      if (m) return m[1].trim();
    }
    return "";
  };
  const firstDate = (t) => {
    const m = /\b(\d{1,2})\/(\d{1,2})\/(\d{4})\b|\b(\d{4})-(\d{2})-(\d{2})\b/.exec(t || "");
    if (!m) return "";
    return m[3] ? `${m[3]}-${pad(m[1])}-${pad(m[2])}` : `${m[4]}-${m[5]}-${m[6]}`;
  };
  const sentences = (t) => (t || "").split(/(?<=[.!?])\s+|\n+/).map((s) => s.trim()).filter((s) => s.length > 25);
  const STOP = new Set(["with", "that", "least", "documented", "within", "following", "criterion", "past", "must"]);
  const words = (s) => new Set((s.toLowerCase().match(/[a-z]{4,}/g) || []).filter((w) => !STOP.has(w)));
  function bestMatch(crit, sents) {
    const w = words(crit); let best = "", score = 0;
    for (const s of sents) { const hits = [...words(s)].filter((x) => w.has(x)).length; if (hits > score) { best = s; score = hits; } }
    return [best.slice(0, 220), score];
  }
  function classify(t) {
    t = t.toLowerCase();
    if (["timely filing", "time limit for filing", "co-29", "filing limit", "eligib"].some((k) => t.includes(k))) return "timely_filing_admin";
    if (["bundl", "ncci", "modifier", "co-97", "included in the payment"].some((k) => t.includes(k))) return "coding_billing";
    if (["prior authorization", "prior auth", "pre-service", "precertification"].some((k) => t.includes(k))) return "prior_authorization";
    return "medical_necessity";
  }

  function generic(agent, cs, prior) {
    const d = cs.documents || {};
    const denial = d.denial_letter || "", notes = d.clinical_notes || "", claim = d.claim_data || "", policy = d.payer_policy || "";
    const all = denial + "\n" + claim;
    if (agent === "intake") {
      const seen = new Set(), cpts = [];
      for (const m of all.matchAll(/\b(\d{5})(?:-([A-Z0-9]{2}))?\b/g)) {
        if (!seen.has(m[1]) && !m[1].startsWith("0")) { seen.add(m[1]); cpts.push({ code: m[1], description: "", modifiers: m[2] ? [m[2]] : [] }); }
      }
      const icds = [...new Set(all.match(/\b[A-TV-Z]\d{2}\.[0-9A-Z]{1,4}\b/g) || [])].map((c) => ({ code: c, description: "" }));
      const amounts = [...all.matchAll(/\$\s?([\d,]+(?:\.\d{2})?)/g)].map((m) => Number(m[1].replace(/,/g, "")));
      const win = /within\s+(\d{2,3})\s+(?:calendar\s+)?days/i.exec(denial);
      let payer = denial.split("\n").map((l) => l.trim()).find((l) => /health|plan|mutual|insurance|care/i.test(l) && l.length < 60 && !l.startsWith("*")) || "";
      if (payer && payer === payer.toUpperCase()) payer = payer.toLowerCase().replace(/\b\w/g, (c) => c.toUpperCase());
      const reason = field(denial, "Reason for denial", "Reason", "Rationale", "Reviewer comment") ||
        sentences(denial).find((s) => /denied|not medically|not met|expired|included/i.test(s)) || "";
      const max = amounts.length ? Math.max(...amounts) : 0;
      return {
        patient_name: field(all, "Patient", "Member"), patient_dob: "", member_id: field(all, "Member ID"), payer_name: payer,
        claim_or_reference_number: field(all, "Claim #", "Claim", "Reference #", "Authorization reference #"),
        rendering_provider: field(all, "Rendering", "Provider", "Requesting provider"),
        procedure_description: cpts[0] ? cpts[0].code : "", cpt_codes: cpts.slice(0, 6), icd10_codes: icds.slice(0, 6),
        date_of_service: firstDate(field(all, "Date of service", "DOS")), denial_date: firstDate(denial),
        billed_amount: max, amount_at_stake: max, stated_denial_reason: reason.slice(0, 400),
        denial_codes: [...new Set(denial.match(/\b(?:CO|PR|OA)-\d{1,3}\b/g) || [])].map((c) => ({ code: c, description: "" })),
        appeal_window_days: win ? Number(win[1]) : 0, appeal_submission_method: "", summary: NOTE,
      };
    }
    if (agent === "triage") {
      const t = classify(denial + " " + claim);
      return { denial_type: t, denial_type_rationale: "Keyword-based classification of the denial letter (demo mode).", winnability: "borderline",
        winnability_score: 50, reasons_for: ["Clinical documentation was provided for review."], reasons_against: ["Not yet assessed in detail (demo-mode template)."],
        recommended_strategy: "Review the criteria checklist and attach the supporting records before submitting.", route_to_coding_check: t === "coding_billing" };
    }
    if (agent === "evidence") {
      const lines = policy.split("\n").map((l) => l.trim().replace(/^[-*\s]+/, ""));
      let crit = lines.filter((l) => /^(criterion|indication|\d+(\.\d+)?[.)]?|[a-e]\))\s/i.test(l) && l.length > 20);
      if (!crit.length) crit = sentences(policy).slice(0, 5);
      const sents = sentences(notes);
      return {
        policy_name: (policy.trim().split("\n")[0] || "Payer policy").slice(0, 120),
        criteria: crit.slice(0, 7).map((c) => {
          const [ex, score] = bestMatch(c, sents);
          return { criterion: c.slice(0, 200), status: score >= 3 ? "met" : "missing_documentation",
            evidence: ex ? "Closest matching statement in the clinical notes (demo-mode keyword match)." : "No matching statement found.",
            citation: { document: ex ? "clinical_notes" : "none", section: "", excerpt: ex },
            action_needed: score >= 3 ? "Verify against the record." : "Locate supporting documentation." };
        }),
        overall_assessment: NOTE, documents_to_attach: ["Relevant clinical notes", "Copy of the denial letter"], gaps: [],
      };
    }
    if (agent === "coding") {
      const i = prior.intake || {};
      const ls = (i.cpt_codes || []).map((c) => ({ cpt: c.code, modifiers: c.modifiers, icd10: (i.icd10_codes || []).slice(0, 2).map((x) => x.code), billed: 0 }));
      return { findings: [{ issue: "Review modifiers and bundling edits", severity: "medium", explanation: "Check NCCI PTP edits and whether a distinct-procedure modifier (59/XS) is supported by the op note." }],
        original_lines: ls, corrected_lines: ls, recommendation: "appeal_with_argument", appeal_argument: NOTE, documentation_support: "" };
    }
    if (agent === "drafting") {
      const i = prior.intake || {}, ev = prior.evidence || {};
      const met = (ev.criteria || []).filter((c) => c.status === "met");
      const bullets = met.map((c) => `- ${c.criterion}: "${c.citation.excerpt}"`).join("\n") || "- [Summarize the supporting clinical evidence]";
      const codes = (i.cpt_codes || []).map((c) => c.code).join(", ") || "[CPT]";
      const letter = `Riverbend Orthopedic Associates
1200 Riverbend Parkway, Suite 300
Fairhaven, ST 00000

${fmt(isoOf(today()), "long")}

${i.payer_name || "[Payer]"} - Appeals Department

RE: Request for reconsideration
Patient: ${i.patient_name || "[Patient]"}    Member ID: ${i.member_id || "[Member ID]"}
Claim / reference #: ${i.claim_or_reference_number || "[Claim #]"}
Service: ${codes}    Date of service: ${i.date_of_service || "[DOS]"}

Dear Appeals Reviewer:

We request reconsideration and reversal of the denial for the service above. The payer
stated: "${i.stated_denial_reason || "[denial reason]"}"

The enclosed records show that the applicable policy criteria are met:
${bullets}

We respectfully request that the denial be overturned and the service approved for payment.

Sincerely,

[Physician signature]
Riverbend Orthopedic Associates

Enclosures:
1. Clinical notes
2. Copy of the denial letter`;
      return { subject_line: "Request for reconsideration", letter_text: letter,
        key_arguments: met.map((c) => c.criterion).slice(0, 5).concat(met.length ? [] : ["Policy criteria are met"]),
        enclosures: ["Clinical notes", "Copy of the denial letter"] };
    }
    return { overall: "ready_with_edits", score: 60,
      flags: [{ severity: "medium", issue: "Template letter generated in demo mode.", location: "Entire letter", suggested_fix: "Review and tailor the arguments." }],
      unsupported_claims: [],
      attachments_checklist: [
        { item: "Clinical notes", source: "clinical_notes", required: true, status: "in_file" },
        { item: "Copy of the denial letter", source: "denial_letter", required: false, status: "in_file" }],
      summary: NOTE };
  }

  function responseFor(agent, cs, prior) {
    if (cs.sample_key) { const d = canned(cs.sample_key, agent, cs.date_ctx || {}); if (d) return d; }
    return generic(agent, cs, prior);
  }

  // ------------------------------------------------------------ state
  let state = { nextId: 1, cases: [], runs: {} };
  const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* storage unavailable */ } };
  const clone = (x) => JSON.parse(JSON.stringify(x));
  const getCase = (id) => state.cases.find((c) => c.id === Number(id));
  const update = (cs, fields) => Object.assign(cs, fields, { updated_at: nowIso() });

  function createCase(documents, title, sampleKey, ctx) {
    const p = generic("intake", { documents }, {});
    const cs = { id: state.nextId++, practice_id: 1, title, status: "New", sample_key: sampleKey || null, date_ctx: ctx || null,
      documents, patient_name: p.patient_name || null, payer: p.payer_name || null, procedure: null, denial_type: null, strength: null,
      amount_at_stake: p.amount_at_stake || null, deadline: null, draft_letter: null, draft_edited: 0, attachments: null,
      approved_by: null, approved_at: null, submitted_at: null, outcome: null, amount_recovered: null, outcome_at: null,
      run_mode: null, run_count: 0, created_at: nowIso(), updated_at: nowIso() };
    state.cases.push(cs);
    state.runs[cs.id] = [];
    return cs;
  }
  function newFromSample(key) {
    const meta = DATA.samples[key].meta;
    const ctx = dateContext(meta.dates);
    return createCase(sampleDocs(key, ctx), meta.title, key, ctx);
  }
  function resetRuns(cs) {
    state.runs[cs.id] = AGENTS.map((a, i) => ({ case_id: cs.id, agent: a, seq: i, status: "queued", mode: null, output: null, note: null,
      started_at: null, finished_at: null, updated_at: Date.now(), label: LABELS[a] }));
  }
  const runOf = (cs, agent) => state.runs[cs.id].find((r) => r.agent === agent);
  function setRun(cs, agent, fields) { Object.assign(runOf(cs, agent), fields, { updated_at: Date.now() }); emit(cs.id, "step", clone(runOf(cs, agent))); }

  function computeDeadline(intake, type) {
    let win = Number(intake.appeal_window_days || 0), basis = "stated in denial letter";
    if (win <= 0) { win = DEFAULT_WINDOW[type] || 60; basis = "default window for this denial type (not stated in letter)"; }
    let denial = /^\d{4}-\d{2}-\d{2}$/.test(intake.denial_date || "") ? parseIso(intake.denial_date) : null;
    if (!denial) { denial = today(); basis += "; denial date not found, counted from today"; }
    const dl = addDays(denial, win);
    return { deadline: isoOf(dl), days_remaining: daysBetween(today(), dl), appeal_window_days: win, deadline_basis: `${isoOf(denial)} + ${win} days (${basis})` };
  }
  function shouldRunCoding(prior) {
    const t = prior.triage || {};
    if (t.denial_type === "coding_billing") return [true, ""];
    if (t.route_to_coding_check) return [true, ""];
    return [false, `Skipped - not a coding/billing denial (${t.denial_type || "unknown"})`];
  }
  function applyToCase(cs, agent, o) {
    if (agent === "intake") update(cs, { patient_name: o.patient_name || null, payer: o.payer_name || null, procedure: o.procedure_description || null, amount_at_stake: o.amount_at_stake || o.billed_amount || 0 });
    else if (agent === "triage") update(cs, { denial_type: o.denial_type, strength: o.winnability, deadline: o.deadline });
    else if (agent === "drafting") update(cs, { draft_letter: o.letter_text, draft_edited: 0 });
    else if (agent === "qa") update(cs, { attachments: (o.attachments_checklist || []).map((a) => ({ ...a, checked: a.status === "in_file" })) });
  }

  // Run synchronously (seeding) or step by step with delays (live demo).
  async function runPipeline(cs, { mode = "demo", delay = STEP_DELAY_MS } = {}) {
    resetRuns(cs);
    if (delay) { update(cs, { status: "Running", run_mode: null }); emit(cs.id, "case", { status: cs.status, run_mode: null }); }
    const prior = {};
    for (const agent of AGENTS) {
      if (agent === "coding") {
        const [need, reason] = shouldRunCoding(prior);
        if (!need) { setRun(cs, agent, { status: "skipped", note: reason, finished_at: nowIso() }); continue; }
      }
      setRun(cs, agent, { status: "running", started_at: nowIso() });
      if (delay) await new Promise((r) => setTimeout(r, delay));
      const out = responseFor(agent, cs, prior);
      if (agent === "triage") Object.assign(out, computeDeadline(prior.intake || {}, out.denial_type));
      prior[agent] = out;
      setRun(cs, agent, { status: "done", mode, output: out, finished_at: nowIso() });
      applyToCase(cs, agent, out);
      if (delay) save();
    }
    update(cs, { run_mode: mode, run_count: (cs.run_count || 0) + 1, status: delay ? "Ready for Review" : cs.status });
    save();
    emit(cs.id, "case", { status: cs.status, run_mode: cs.run_mode });
    emit(cs.id, "done", { status: cs.status });
  }

  function reset() {
    state = { nextId: 1, cases: [], runs: {} };
    for (const key of DATA.seed_order) {
      const meta = DATA.samples[key].meta, st = meta.seed_state || {};
      const cs = newFromSample(key);
      if ((st.status || "New") === "New") continue;
      runPipeline(cs, { mode: "seeded", delay: 0 });
      const f = { status: st.status };
      if (st.approved_by) { const sub = cs.date_ctx[st.submitted_offset]; Object.assign(f, { approved_by: st.approved_by, approved_at: sub, submitted_at: sub }); }
      if (st.outcome) f.outcome = st.outcome;
      if (st.outcome_offset) f.outcome_at = cs.date_ctx[st.outcome_offset];
      if ("amount_recovered" in st) f.amount_recovered = st.amount_recovered;
      update(cs, f);
    }
    save();
  }

  // ------------------------------------------------------------ metrics (mirrors app/metrics.py)
  const daysRemaining = (c) => (c.deadline ? daysBetween(today(), parseIso(c.deadline)) : null);
  function urgency(c) {
    if (c.status === "Submitted" || c.status === "Closed") return "none";
    const d = daysRemaining(c);
    if (d == null) return "unknown";
    return d <= 14 ? "red" : d <= 30 ? "yellow" : "green";
  }
  const decorate = (c) => ({ ...clone(c), days_remaining: daysRemaining(c), urgency: urgency(c) });
  const tierOf = (name) => DATA.pricing.tiers.find((t) => t.name === name);

  function practiceNumbers(p, cases) {
    const pr = DATA.pricing, tier = tierOf(p.tier), base = p.baseline;
    const mine = p.live ? cases.filter((c) => c.practice_id === p.id) : [];
    const decided = mine.filter((c) => c.outcome === "Overturned" || c.outcome === "Upheld");
    const over = decided.filter((c) => c.outcome === "Overturned");
    const processed = mine.filter((c) => (c.run_count || 0) > 0).length;
    const nD = base.decided_appeals + decided.length, nO = base.overturned_appeals + over.length;
    const recovered = base.dollars_recovered + over.reduce((s, c) => s + (c.amount_recovered || 0), 0);
    const apps = base.appeals_processed_to_date + processed;
    const hours = (apps * (pr.manual_minutes_per_appeal - pr.assisted_minutes_per_appeal)) / 60;
    const staff = hours * pr.staff_cost_per_hour, fee90 = tier.price_per_month * 3;
    return { id: p.id, name: p.name, surgeons: p.surgeons, live: !!p.live, tier: tier.name, price_per_month: tier.price_per_month,
      appeals_limit: tier.appeals_per_month, appeals_used: base.appeals_used_this_month + processed, decided: nD, overturned: nO,
      overturn_rate: nD ? Math.round((1000 * nO) / nD) / 10 : 0, dollars_recovered: recovered, appeals_processed: apps,
      staff_hours_saved: Math.round(hours * 10) / 10, staff_cost_saved: Math.round(staff),
      roi_multiple: fee90 ? Math.round(((recovered + staff) / fee90) * 10) / 10 : null };
  }
  function metrics() {
    const cases = state.cases.map(decorate);
    const per = DATA.practices.map((p) => practiceNumbers(p, cases));
    const me = per.find((p) => p.live);
    const live = cases.filter((c) => c.practice_id === me.id);
    const open = live.filter((c) => c.status !== "Closed");
    const due = open.filter((c) => c.status !== "Submitted" && c.days_remaining != null && c.days_remaining <= 14).sort((a, b) => a.days_remaining - b.days_remaining);
    const pending = live.filter((c) => c.status === "Submitted");
    const sum = (xs) => xs.reduce((s, c) => s + (c.amount_at_stake || 0), 0);
    const mrr = per.reduce((s, p) => s + p.price_per_month, 0);
    const byType = {};
    ["prior_authorization", "medical_necessity", "coding_billing", "timely_filing_admin"].forEach((t) => (byType[t] = open.filter((c) => c.denial_type === t).length));
    return {
      practice: me,
      dashboard: { open_denials: open.length, dollars_at_stake: sum(open), awaiting_review: live.filter((c) => c.status === "Ready for Review").length,
        pending_outcome: pending.length, pending_dollars: sum(pending), deadlines_next_14_days: due.length,
        due_soon: due.map((c) => ({ id: c.id, title: c.title, patient_name: c.patient_name, deadline: c.deadline, days_remaining: c.days_remaining, status: c.status })),
        overturn_rate: me.overturn_rate, dollars_recovered: me.dollars_recovered, staff_hours_saved: me.staff_hours_saved,
        plan: { tier: me.tier, used: me.appeals_used, limit: me.appeals_limit }, by_type: byType },
      business: { practices: per, mrr, arr: mrr * 12, total_recovered: per.reduce((s, p) => s + p.dollars_recovered, 0),
        total_hours_saved: Math.round(per.reduce((s, p) => s + p.staff_hours_saved, 0) * 10) / 10, pricing: DATA.pricing },
    };
  }

  // ------------------------------------------------------------ subscriptions (stand-in for SSE)
  const subs = {};
  function emit(id, type, data) { (subs[id] || new Set()).forEach((fn) => fn(type, data)); }
  function subscribe(id, fn) {
    id = Number(id);
    (subs[id] = subs[id] || new Set()).add(fn);
    const cs = getCase(id);
    // Replay current state, like the server stream does on connect.
    setTimeout(() => {
      (state.runs[id] || []).forEach((r) => fn("step", clone(r)));
      if (cs && cs.status !== "Running") fn("done", { status: cs.status });
    }, 0);
    return () => subs[id] && subs[id].delete(fn);
  }

  // ------------------------------------------------------------ request router (mirrors app/main.py)
  const fail = (msg) => { throw new Error(msg); };
  const full = (cs) => ({ ...decorate(cs), runs: clone(state.runs[cs.id] || []), running: cs.status === "Running" });

  async function request(method, path, body) {
    await new Promise((r) => setTimeout(r, 30));
    let m;
    if (method === "GET" && path === "/status") return { mode: "demo", browser_only: true, has_key: false, force_demo: false, model: "-", effort: "-" };
    if (method === "GET" && path === "/metrics") return metrics();
    if (method === "GET" && path === "/samples") return DATA.seed_order.map((k) => ({ key: k, label: DATA.samples[k].meta.label, title: DATA.samples[k].meta.title }));
    if (method === "GET" && (m = path.match(/^\/samples\/(\w+)$/))) {
      const s = DATA.samples[m[1]] || fail("Unknown sample");
      const ctx = dateContext(s.meta.dates);
      return { key: m[1], title: s.meta.title, date_ctx: ctx, documents: sampleDocs(m[1], ctx) };
    }
    if (method === "POST" && path === "/demo/reset") { reset(); return { reset: true, cases: state.cases.length }; }
    if (method === "GET" && path === "/cases") return state.cases.map((c) => { const d = decorate(c); delete d.documents; delete d.draft_letter; return d; });
    if (method === "POST" && path === "/cases") {
      if (body.sample_key && !DATA.samples[body.sample_key]) fail("Unknown sample_key");
      const docs = Object.assign({ denial_letter: "", clinical_notes: "", claim_data: "", payer_policy: "" }, body.documents || {});
      if (!docs.denial_letter.trim()) fail("A denial letter / EOB is required");
      const cs = createCase(docs, (body.title || "").trim() || "New denial", body.sample_key, body.sample_key ? body.date_ctx : null);
      save();
      return full(cs);
    }
    if (!(m = path.match(/^\/cases\/(\d+)(\/\w+)?$/))) fail("Not found");
    const cs = getCase(m[1]) || fail("Case not found");
    const action = m[2] || "";
    if (method === "GET" && !action) return full(cs);
    if (method === "POST" && action === "/run") {
      if (cs.status === "Submitted" || cs.status === "Closed") fail(`Case is already ${cs.status}`);
      if (cs.status === "Running") fail("Pipeline already running");
      update(cs, { status: "Running" });
      resetRuns(cs);
      runPipeline(cs);
      return { started: true, case_id: cs.id };
    }
    if (method === "PATCH" && action === "/draft") {
      if (cs.status === "Submitted" || cs.status === "Closed") fail("Draft is locked after submission");
      update(cs, { draft_letter: body.draft_letter, draft_edited: 1 }); save(); return full(cs);
    }
    if (method === "POST" && action === "/approve") {
      if (cs.status !== "Ready for Review") fail(`Only cases in 'Ready for Review' can be approved (status: ${cs.status})`);
      const f = { status: "Submitted", outcome: "Pending", approved_by: body.approved_by || "Office staff", approved_at: nowIso(), submitted_at: nowIso() };
      if (body.attachments) f.attachments = body.attachments;
      update(cs, f); save(); return full(cs);
    }
    if (method === "PATCH" && action === "/outcome") {
      if (!["Overturned", "Upheld", "Pending"].includes(body.outcome)) fail("outcome must be Overturned, Upheld or Pending");
      if (cs.status !== "Submitted" && cs.status !== "Closed") fail("Approve and submit the appeal before recording an outcome");
      if (body.outcome === "Pending") update(cs, { outcome: "Pending", status: "Submitted", outcome_at: null, amount_recovered: null });
      else {
        let rec = body.amount_recovered;
        if (rec == null) rec = body.outcome === "Overturned" ? cs.amount_at_stake || 0 : 0;
        update(cs, { outcome: body.outcome, status: "Closed", outcome_at: nowIso(), amount_recovered: body.outcome === "Overturned" ? rec : 0 });
      }
      save(); return full(cs);
    }
    fail("Not found");
  }

  // ------------------------------------------------------------ boot
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (saved && saved.cases && saved.cases.length) {
      state = saved;
      // A run interrupted by a page reload can't resume; mark it finished on canned data.
      state.cases.filter((c) => c.status === "Running").forEach((c) => runPipeline(c, { delay: 0 }) && update(c, { status: "Ready for Review" }));
    } else reset();
  } catch (e) { reset(); }

  window.APPEALS_BACKEND = { request, subscribe };
})();

</script>
<script>
// Appeals prototype frontend - plain JS, hash routing, no build step.
// Talks to the FastAPI server, or to an in-page engine (window.APPEALS_BACKEND) in the
// browser-only build produced by static-demo/build.py.
"use strict";

const $app = document.getElementById("app");
const BACKEND = window.APPEALS_BACKEND || null;

// ---------------------------------------------------------------- helpers
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = (n) => n == null ? "-" : "$" + Number(n).toLocaleString("en-US", { maximumFractionDigits: 0 });
const fmtDate = (iso) => {
  if (!iso) return "-";
  const d = new Date(iso.length === 10 ? iso + "T12:00:00" : iso);
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
};

async function api(path, opts = {}) {
  if (BACKEND) return BACKEND.request(opts.method || "GET", path, opts.body);
  const res = await fetch(path, {
    headers: { "Content-Type": "application/json" },
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || `Request failed (${res.status})`);
  return data;
}

// Live pipeline updates: server-sent events, or the in-page engine's subscription.
function openStream(caseId, on) {
  if (BACKEND) return { close: BACKEND.subscribe(caseId, (type, data) => on[type] && on[type](data)) };
  const es = new EventSource(`/cases/${caseId}/stream`);
  ["step", "case", "done"].forEach((t) => es.addEventListener(t, (ev) => on[t] && on[t](JSON.parse(ev.data))));
  if (on.done) es.addEventListener("done", () => es.close());
  return es;
}

// In-page confirmation (browser dialogs are unavailable in some embedded viewers).
function confirmBox(message, okLabel = "Continue") {
  return new Promise((resolve) => {
    const wrap = document.createElement("div");
    wrap.className = "modal-backdrop";
    wrap.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><p>${esc(message).replace(/\n/g, "<br>")}</p>
      <div class="actions"><button class="btn" id="modal-ok">${esc(okLabel)}</button><button class="btn btn-ghost" id="modal-cancel">Cancel</button></div></div>`;
    document.body.appendChild(wrap);
    const done = (v) => { wrap.remove(); resolve(v); };
    wrap.querySelector("#modal-ok").onclick = () => done(true);
    wrap.querySelector("#modal-cancel").onclick = () => done(false);
    wrap.onclick = (e) => { if (e.target === wrap) done(false); };
    wrap.querySelector("#modal-ok").focus();
  });
}

async function copyText(text, fallbackEl) {
  try { await navigator.clipboard.writeText(text); toast("Copied to clipboard."); }
  catch { if (fallbackEl) { fallbackEl.focus(); fallbackEl.select(); } toast("Press Cmd+C / Ctrl+C to copy the selected text."); }
}

function toast(msg, ms = 3200) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.remove("hidden");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.add("hidden"), ms);
}

const TYPE_LABEL = {
  prior_authorization: "Prior auth",
  medical_necessity: "Medical necessity",
  coding_billing: "Coding / billing",
  timely_filing_admin: "Timely filing / admin",
};
const typeBadge = (t) => t ? `<span class="badge b-blue">${esc(TYPE_LABEL[t] || t)}</span>` : `<span class="badge">Not triaged</span>`;
const strengthBadge = (s) => {
  const cls = { strong: "b-green", borderline: "b-yellow", weak: "b-red" }[s];
  return s ? `<span class="badge ${cls}">${esc(s)}</span>` : `<span class="muted">-</span>`;
};
const statusBadge = (s, outcome) => {
  if (s === "Closed") return outcome === "Overturned"
    ? `<span class="badge b-green">Overturned</span>` : `<span class="badge b-red">${esc(outcome || "Closed")}</span>`;
  const cls = { New: "", Running: "b-blue", "Ready for Review": "b-purple", Submitted: "b-yellow" }[s] || "";
  return `<span class="badge ${cls}">${esc(s === "Submitted" ? "Submitted · Pending" : s)}</span>`;
};
const modeBadge = (m) => {
  if (!m) return "";
  const cls = { live: "b-green", demo: "b-yellow", mixed: "b-yellow", seeded: "" }[m] || "";
  const label = { live: "LIVE AI", demo: "DEMO", mixed: "MIXED", seeded: "PRE-RUN SAMPLE" }[m] || m;
  return `<span class="badge ${cls}">${label}</span>`;
};
const deadlineCell = (c) => {
  if (!c.deadline) return `<span class="muted">-</span>`;
  if (c.urgency === "none") return `<span class="muted">${fmtDate(c.deadline)}</span>`;
  const d = c.days_remaining;
  const txt = d < 0 ? `${-d}d overdue` : `${d}d left`;
  return `<span class="dot ${c.urgency}"></span>${fmtDate(c.deadline)} <span class="muted small">(${txt})</span>`;
};
const statusLabel = { met: ["Met", "b-green"], not_met: ["Not met", "b-red"], missing_documentation: ["Missing docs", "b-yellow"] };
const critBadge = (s) => `<span class="badge ${(statusLabel[s] || ["", ""])[1]}">${esc((statusLabel[s] || [s])[0])}</span>`;
const sevBadge = (s) => `<span class="badge ${{ high: "b-red", medium: "b-yellow", low: "" }[s] || ""}">${esc(s)}</span>`;

// ---------------------------------------------------------------- mode badge
let MODE = null;
async function refreshMode() {
  MODE = await api("/status");
  const b = document.getElementById("mode-badge");
  b.className = "mode-badge " + MODE.mode;
  b.textContent = MODE.mode === "live" ? `● LIVE · ${MODE.model}`
    : MODE.browser_only ? "● DEMO · browser version"
    : (MODE.has_key ? "● DEMO MODE (forced)" : "● DEMO MODE · no API key");
}
document.getElementById("mode-badge").onclick = async () => {
  if (MODE.browser_only) return toast("This browser version uses pre-written agent responses. Live AI runs in the full local app.", 5000);
  if (!MODE.has_key) return toast("No ANTHROPIC_API_KEY in .env - running on canned demo responses.");
  await api("/settings/mode", { method: "POST", body: { force_demo: MODE.mode === "live" } });
  await refreshMode();
  toast(MODE.mode === "live" ? "Live mode: agents call the Claude API." : "Demo mode: agents use canned responses.");
};
document.getElementById("reset-btn").onclick = async () => {
  if (!(await confirmBox("Reset the demo? This restores the 5 sample cases and deletes any cases you created.", "Reset demo"))) return;
  await api("/demo/reset", { method: "POST" });
  toast("Demo data restored.");
  if (currentPath() === "#/dashboard") route(); else navigate("#/dashboard");
};

// ---------------------------------------------------------------- router
// Routing: URL hash with the server; an in-memory path in the browser-only build.
let activeStream = null;
let memoryPath = "#/dashboard";
const currentPath = () => (BACKEND ? memoryPath : location.hash);
function navigate(path) {
  if (BACKEND) { memoryPath = path; route(); } else location.hash = path;
}
if (BACKEND) {
  document.addEventListener("click", (e) => {
    const a = e.target.closest('a[href^="#/"]');
    if (a) { e.preventDefault(); navigate(a.getAttribute("href")); }
  });
}
function route() {
  if (activeStream) { activeStream.close(); activeStream = null; }
  const parts = (currentPath().replace(/^#\/?/, "") || "dashboard").split("/");
  document.querySelectorAll("nav a").forEach((a) =>
    a.classList.toggle("active", a.dataset.nav === parts[0] || (parts[0] === "case" && a.dataset.nav === "queue")));
  const views = { dashboard: viewDashboard, queue: viewQueue, new: viewNew, case: viewCase, review: viewReview, business: viewBusiness };
  const fn = views[parts[0]] || viewDashboard;
  Promise.resolve(fn(...parts.slice(1))).catch((e) => {
    $app.innerHTML = `<div class="card"><h2>Something went wrong</h2><p>${esc(e.message)}</p></div>`;
  });
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);

// ---------------------------------------------------------------- 1. dashboard

  $app.innerHTML = `

          <td>${statusBadge(c.status)}</td><td class="num"><b>${c.days_remaining}d</b><div class="muted small">${fmtDate(c.deadline)}</div></td></tr>`).join("")}</tbody></table>`
          : `<p class="muted">Nothing due in the next 14 days.</p>`}

          <td>${statusBadge(c.status)}</td><td class="num">${money(c.amount_at_stake)}</td></tr>`).join("")}</tbody></table>`
          : `<p class="muted">Queue is clear.</p>`}
        <h3>Open denials by type</h3>
        ${Object.entries(d.by_type).map(([t, n]) => `
          <div class="hbar"><div class="lbl">${TYPE_LABEL[t]}</div><div class="track"><div class="fill" style="width:${(100 * n) / typeMax}%"></div></div><div class="val">${n}</div></div>`).join("")}

// ---------------------------------------------------------------- 2. queue
const queueFilters = { type: "", status: "open", urgency: "" };
async function viewQueue() {
  const cases = await api("/cases");
  const render = () => {
    const rows = cases.filter((c) => {
      if (queueFilters.type && c.denial_type !== queueFilters.type) return false;
      if (queueFilters.status === "open" && c.status === "Closed") return false;
      if (queueFilters.status && queueFilters.status !== "open" && c.status !== queueFilters.status) return false;
      if (queueFilters.urgency && c.urgency !== queueFilters.urgency) return false;
      return true;
    });
    $app.innerHTML = `
      <div class="page-head"><div><h1>Case queue</h1><div class="muted">${rows.length} of ${cases.length} cases</div></div>

          ${["New", "Running", "Ready for Review", "Submitted", "Closed"].map((s) => `<option>${s}</option>`).join("")}
        </select>
        <select id="f-urg"><option value="">Any deadline</option><option value="red">🔴 ≤ 14 days</option><option value="yellow">🟡 15-30 days</option><option value="green">🟢 &gt; 30 days</option></select>
      </div>

        <table>
          <thead><tr><th>#</th><th>Patient / case</th><th>Payer</th><th>Denial type</th><th>Strength</th><th class="num">At stake</th><th>Appeal deadline</th><th>Status</th></tr></thead>
          <tbody>${rows.map((c) => `
            <tr class="clickable" data-href="#/case/${c.id}">
              <td class="muted">${c.id}</td>
              <td><b>${esc(c.patient_name || "-")}</b><div class="muted small">${esc(c.title)}</div></td>
              <td>${esc(c.payer || "-")}</td>
              <td>${typeBadge(c.denial_type)}</td>
              <td>${strengthBadge(c.strength)}</td>
              <td class="num">${money(c.amount_at_stake)}</td>
              <td>${deadlineCell(c)}</td>
              <td>${statusBadge(c.status, c.outcome)}</td>
            </tr>`).join("") || `<tr><td colspan="8" class="muted">No cases match these filters.</td></tr>`}
          </tbody>
        </table>
      </div>`;
    document.getElementById("f-type").value = queueFilters.type;
    document.getElementById("f-status").value = queueFilters.status;
    document.getElementById("f-urg").value = queueFilters.urgency;

const DOCS = [
  ["denial_letter", "Denial letter / EOB", "Required"],

async function viewNew() {

        <input type="text" id="title" style="width:100%" placeholder="e.g. Total knee arthroplasty - prior auth denied"></div>

  const markEdited = () => {
    if (sample) { sample = null; document.getElementById("sample-note").textContent = "Edited - demo mode will use generic template output for this case."; }
  };
  DOCS.forEach(([k]) => document.getElementById("doc-" + k).addEventListener("input", markEdited));

    r.onload = () => { document.getElementById("doc-" + inp.dataset.doc).value = r.result; markEdited(); };

  document.getElementById("load-sample").onclick = async () => {

    navigate(`#/case/${c.id}`);
  };
  document.getElementById("create-run").onclick = () => create(true).catch((e) => toast(e.message));

const AGENT_ORDER = ["intake", "triage", "evidence", "coding", "drafting", "qa"];
const AGENT_ICON = { intake: "📥", triage: "🧭", evidence: "📋", coding: "🔢", drafting: "✍️", qa: "🔍" };

function pipelineHTML(c) {
  const runs = Object.fromEntries((c.runs || []).map((r) => [r.agent, r]));
  const st = (cls, icon, name, meta = "", agent = false) =>
    `<div class="stage ${cls} ${agent ? "agent" : ""}"><div class="node">${icon}</div><div class="name">${name}</div><div class="meta">${meta}</div></div>`;
  const after = {
    review: c.status === "Ready for Review" ? "running" : ["Submitted", "Closed"].includes(c.status) ? "done" : "",
    submitted: ["Submitted", "Closed"].includes(c.status) ? "done" : "",
    outcome: c.status === "Closed" ? (c.outcome === "Overturned" ? "done" : "error") : c.status === "Submitted" ? "running" : "",
  };
  return `<div class="pipeline">
    ${st("done", "⬆", "Upload", '<span class="muted">4 docs</span>')}
    ${AGENT_ORDER.map((a) => {
      const r = runs[a];
      const s = r ? r.status : "";
      const cls = s === "done" ? "done" : s === "running" ? "running" : s === "skipped" ? "skipped" : s === "error" ? "error" : "";
      const meta = s === "running" ? '<span class="badge b-blue">working…</span>'
        : s === "skipped" ? '<span class="muted">skipped</span>' : r && r.mode ? modeBadge(r.mode) : "";
      return st(cls, AGENT_ICON[a], r ? r.label : a, meta, true);
    }).join("")}
    ${st(after.review, "👤", "Staff Review", c.approved_by ? `<span class="muted">${esc(c.approved_by.replace(/\s*\(.*\)$/, ""))}</span>` : "")}
    ${st(after.submitted, "📨", "Submitted", c.submitted_at ? `<span class="muted">${fmtDate(c.submitted_at)}</span>` : "")}
    ${st(after.outcome, c.status === "Closed" ? (c.outcome === "Overturned" ? "✔" : "✖") : "⏳", "Outcome",
      c.outcome ? `<span class="badge ${c.outcome === "Overturned" ? "b-green" : c.outcome === "Upheld" ? "b-red" : "b-yellow"}">${esc(c.outcome)}</span>` : "")}
  </div>`;
}

const attStatus = (s) => `<span class="badge ${{ in_file: "b-green", needs_upload: "b-red", verify: "b-yellow" }[s] || ""}">${esc((s || "").replace(/_/g, " "))}</span>`;

function panelsHTML(c, openAgent) {
  return (c.runs || []).map((r) => {
    if (r.status === "queued") return "";
    const head = `${AGENT_ICON[r.agent]} ${esc(r.label)} ${r.status === "running" ? '<span class="badge b-blue">working…</span>' : r.status === "skipped" ? '<span class="badge">skipped</span>' : modeBadge(r.mode)}`;
    let body;
    if (r.status === "skipped") body = `<p class="muted">${esc(r.note)}</p>`;
    else if (r.status === "running") body = `<p class="muted">Agent is working…</p>`;
    else {
      try { body = R[r.agent](r.output); } catch (e) { body = `<p class="muted">Could not render this output.</p>`; }
      body += r.note ? `<div class="note">${esc(r.note)}</div>` : "";
      body += `<details style="margin-top:10px"><summary class="small muted" style="cursor:pointer">Show raw JSON</summary><pre class="json">${esc(JSON.stringify(r.output, null, 2))}</pre></details>`;
    }
    return `<details class="panel" data-agent="${r.agent}" ${openAgent === r.agent ? "open" : ""}><summary>${head}</summary><div class="body">${body}</div></details>`;
  }).join("");
}

async function viewCase(id) {
  let c = await api(`/cases/${id}`);
  const openPanels = new Set();
  const render = (focusAgent) => {
    // While the pipeline runs, keep only the step that just finished expanded.
    if (focusAgent) { openPanels.clear(); openPanels.add(focusAgent); }
    else $app.querySelectorAll("details.panel[open]").forEach((d) => openPanels.add(d.dataset.agent));
    const canRun = ["New", "Ready for Review"].includes(c.status) && !c.running;
    $app.innerHTML = `
      <div class="page-head">
        <div>
          <div class="muted small"><a href="#/queue">← Case queue</a> · Case #${c.id}</div>
          <h1>${esc(c.title)}</h1>
          <div>${esc(c.patient_name || "")} ${c.payer ? "· " + esc(c.payer) : ""} ${c.amount_at_stake ? "· <b>" + money(c.amount_at_stake) + "</b> at stake" : ""}</div>
          <div style="margin-top:6px">${statusBadge(c.status, c.outcome)} ${typeBadge(c.denial_type)} ${strengthBadge(c.strength)} ${c.deadline ? `<span class="badge">${deadlineCell(c).replace(/<[^>]+>/g, "")}</span>` : ""} ${modeBadge(c.run_mode)}</div>
        </div>
        <div class="actions">
          ${canRun ? `<button class="btn ${c.status === "New" ? "btn-lg" : "btn-ghost"}" id="run-btn">${c.status === "New" ? "▶ Run agent pipeline" : "↻ Re-run agents"}</button>` : ""}
          ${c.status === "Ready for Review" ? `<a class="btn btn-lg btn-green" href="#/review/${c.id}">Staff review →</a>` : ""}
        </div>
      </div>
      <div class="card">${pipelineHTML(c)}</div>
      ${c.status === "New" ? `<div class="note info">Documents uploaded. Click <b>Run agent pipeline</b> to start the agent team.</div>` : ""}
      ${["Submitted", "Closed"].includes(c.status) ? outcomeCardHTML(c) : ""}
      <div id="panels">${panelsHTML(c, focusAgent)}</div>
      <details class="panel"><summary>📄 Uploaded documents</summary><div class="body">
        ${DOCS.map(([k, label]) => `<h3>${label}</h3><pre class="json" style="max-height:220px">${esc((c.documents || {})[k] || "(not provided)")}</pre>`).join("")}
      </div></details>`;
    openPanels.forEach((a) => { const d = $app.querySelector(`details.panel[data-agent="${a}"]`); if (d) d.open = true; });
    const rb = document.getElementById("run-btn");
    if (rb) rb.onclick = async () => {
      rb.disabled = true;
      try { await api(`/cases/${c.id}/run`, { method: "POST" }); c.running = true; c.status = "Running"; listen(); }
      catch (e) { toast(e.message); rb.disabled = false; }
    };
    bindOutcome(c, async () => { c = await api(`/cases/${id}`); render(); });
  };

  const listen = () => {
    if (activeStream) activeStream.close();
    activeStream = openStream(c.id, {
      step: (r) => {
        c.runs = AGENT_ORDER.map((a) => (a === r.agent ? r : (c.runs || []).find((x) => x.agent === a) || { agent: a, status: "queued", label: a }));
        render(r.status === "done" ? r.agent : undefined);
      },
      case: (d) => Object.assign(c, d),
      done: async () => {
        if (activeStream) { activeStream.close(); activeStream = null; }
        c = await api(`/cases/${c.id}`);
        render("qa");
        toast(`Pipeline finished (${c.run_mode === "live" ? "live AI" : c.run_mode === "mixed" ? "partly demo - see step notes" : "demo mode"}). Ready for staff review.`, 5000);
        refreshMode();
      },
    });
  };

  render();
  if (c.running || c.status === "Running") listen();
}

function outcomeCardHTML(c) {
  return `<div class="card" style="margin-top:12px">
    <h2>Payer outcome</h2>
    <p class="muted small">Submitted ${fmtDate(c.submitted_at)} by ${esc(c.approved_by || "staff")} (mock submission). Record the payer's decision when it arrives.</p>
    <div class="actions">
      <label>Amount recovered / approved $ <input type="number" id="rec-amt" value="${c.outcome === "Overturned" ? c.amount_recovered ?? c.amount_at_stake : c.amount_at_stake ?? 0}" style="width:130px"></label>
      <button class="btn btn-green" data-outcome="Overturned">Overturned ✔</button>
      <button class="btn btn-red" data-outcome="Upheld">Upheld ✖</button>
      <button class="btn btn-ghost" data-outcome="Pending">Pending ⏳</button>
      <span>Current: <b>${esc(c.outcome || "Pending")}</b>${c.outcome === "Overturned" ? ` · ${money(c.amount_recovered)} recovered` : ""}</span>
    </div></div>`;
}
function bindOutcome(c, after) {
  $app.querySelectorAll("[data-outcome]").forEach((b) => (b.onclick = async () => {
    const amt = document.getElementById("rec-amt");
    const body = { outcome: b.dataset.outcome };
    if (b.dataset.outcome === "Overturned" && amt && amt.value !== "") body.amount_recovered = Number(amt.value);
    try {
      await api(`/cases/${c.id}/outcome`, { method: "PATCH", body });
      toast(b.dataset.outcome === "Overturned" ? "Overturned! Recovery added to the practice and business totals." : `Outcome set to ${b.dataset.outcome}.`);
      after();
    } catch (e) { toast(e.message); }
  }));
}

async function viewReview(id) {
  const c = await api(`/cases/${id}`);
  const out = Object.fromEntries((c.runs || []).filter((r) => r.output).map((r) => [r.agent, r.output]));

  const ev = out.evidence || {};
  const atts = c.attachments || (qa.attachments_checklist || []).map((a) => ({ ...a, checked: a.status === "in_file" }));
  const locked = c.status !== "Ready for Review";
  const counts = { met: 0, not_met: 0, missing_documentation: 0 };
  (ev.criteria || []).forEach((x) => (counts[x.status] = (counts[x.status] || 0) + 1));
  $app.innerHTML = `
    <div class="page-head">
      <div><div class="muted small"><a href="#/case/${c.id}">← Case #${c.id}</a></div>
        <h1>Staff review: ${esc(c.patient_name || c.title)}</h1>
        <div>${esc(c.title)} · ${esc(c.payer || "")} · ${money(c.amount_at_stake)} · deadline ${deadlineCell(c)}</div></div>
      <div>${statusBadge(c.status, c.outcome)}</div>
    </div>
    ${locked ? `<div class="note">This case is ${esc(c.status)}; the letter is locked.</div>` : ""}
    <div class="grid" style="grid-template-columns: 1.6fr 1fr">
      <div class="card">
        <div class="page-head" style="margin:0 0 8px"><h2 style="margin:0">Appeal letter ${c.draft_edited ? '<span class="badge b-purple">edited by staff</span>' : ""}</h2>
          <span class="actions" style="margin:0"><button class="btn btn-ghost btn-sm" id="copy-letter">Copy letter</button>
          ${BACKEND ? "" : `<a class="btn btn-ghost btn-sm" href="/cases/${c.id}/letter.txt">Download .txt</a>`}</span></div>
        <textarea id="letter" rows="34" ${locked ? "readonly" : ""} style="font-family: var(--font-letter); font-size: 13.5px">${esc(c.draft_letter || "")}</textarea>
        ${locked ? "" : `<div class="actions"><button class="btn btn-ghost" id="save-draft">Save edits</button><span id="save-state" class="muted small"></span></div>`}
      </div>
      <div>
        <div class="card">
          <h2>QA review ${qa.score != null ? `<span class="muted" style="font-weight:400">· ${qa.score}/100</span>` : ""}</h2>
          <p class="small">${esc(qa.summary || "")}</p>
          ${(qa.flags || []).map((f) => `<div class="flag ${f.severity}">${sevBadge(f.severity)} <b class="small">${esc(f.issue)}</b><div class="small">Fix: ${esc(f.suggested_fix)}</div></div>`).join("")}
          ${qa.unsupported_claims && qa.unsupported_claims.length ? `<h3>Unsupported claims</h3><ul class="tight small">${qa.unsupported_claims.map((u) => `<li>${esc(u)}</li>`).join("")}</ul>` : ""}
        </div>
        <div class="card" style="margin-top:12px">
          <h2>Attachments checklist</h2>
          <div class="checklist">${atts.map((a, i) => `
            <label><input type="checkbox" data-att="${i}" ${a.checked ? "checked" : ""} ${locked ? "disabled" : ""}>
            <span>${esc(a.item)} ${a.required ? '<span class="badge b-red">required</span>' : ""} ${attStatus(a.status)}<br><span class="muted small">${esc(a.source)}</span></span></label>`).join("") || '<p class="muted">No attachments listed.</p>'}
          </div>
        </div>
        <div class="card" style="margin-top:12px">
          <h2>Criteria checklist</h2>
          <p>${critBadge("met")} ${counts.met} &nbsp; ${critBadge("missing_documentation")} ${counts.missing_documentation} &nbsp; ${critBadge("not_met")} ${counts.not_met}</p>
          <ul class="tight small">${(ev.criteria || []).map((x) => `<li>${critBadge(x.status)} ${esc(x.criterion)}</li>`).join("")}</ul>
          <a class="small" href="#/case/${c.id}">See full evidence with citations →</a>
        </div>
        ${locked ? "" : `<div class="card" style="margin-top:12px">
          <label class="field" for="approver">Approved by</label>
          <input type="text" id="approver" value="M. Alvarez (Billing Lead)" style="width:100%">
          <div class="actions"><button class="btn btn-lg btn-green" id="approve" style="width:100%">✔ Approve &amp; Mark Submitted</button></div>
          <p class="muted small">Prototype: submission is mocked. Staff send the appeal through the payer's portal, fax or mail.</p>
        </div>`}
      </div>
    </div>`;
  document.getElementById("copy-letter").onclick = () => copyText(document.getElementById("letter").value, document.getElementById("letter"));
  if (locked) return;
  const save = async () => {
    await api(`/cases/${c.id}/draft`, { method: "PATCH", body: { draft_letter: document.getElementById("letter").value } });
    document.getElementById("save-state").textContent = "Saved " + new Date().toLocaleTimeString();
  };
  document.getElementById("save-draft").onclick = () => save().catch((e) => toast(e.message));
  document.getElementById("approve").onclick = async () => {
    $app.querySelectorAll("[data-att]").forEach((cb) => (atts[cb.dataset.att].checked = cb.checked));
    const missing = atts.filter((a) => a.required && !a.checked);
    if (missing.length && !(await confirmBox(`${missing.length} required attachment(s) not checked:\n\n- ${missing.map((m) => m.item).join("\n- ")}\n\nApprove anyway?`, "Approve anyway"))) return;
    try {
      if (document.getElementById("letter").value !== (c.draft_letter || "")) await save();
      await api(`/cases/${c.id}/approve`, { method: "POST", body: { approved_by: document.getElementById("approver").value || "Office staff", attachments: atts } });
      toast("Approved and marked Submitted.");
      navigate(`#/case/${c.id}`);
    } catch (e) { toast(e.message); }
  };
}

      </tbody></table>
    </div>`;
  $app.querySelectorAll("[data-q]").forEach((btn) => (btn.onclick = async () => {
    await api(`/cases/${btn.dataset.q}/outcome`, { method: "PATCH", body: { outcome: btn.dataset.o } });
    toast(`Marked ${btn.dataset.o}.`);
    viewBusiness();
  }));
}

// ---------------------------------------------------------------- boot
refreshMode().catch(() => {});
route();

</script>
</body>
</html>
